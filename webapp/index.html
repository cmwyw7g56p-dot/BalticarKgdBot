<style>
:root{--bg:#06101a;--panel:#0b1b29;--panel2:#102537;--line:rgba(255,255,255,.09);--text:#f5f8fb;--muted:#91a3b5;--blue:#1683ff;--blue2:#0b63d9;--green:#2bd576;--amber:#ffb62b;--danger:#ff5f6d;--radius:22px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}body{background:radial-gradient(900px 500px at 50% -10%,#123657 0,#07131f 55%,#06101a 100%)}button{font:inherit;color:inherit;border:0;cursor:pointer}#app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 12px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent)}.brand{font-weight:800;letter-spacing:.08em;font-size:18px}.brand span{color:#5db1ff}.topbtn{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:19px}.screen{display:none}.screen.active{display:block;animation:in .22s ease}@keyframes in{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:#0b1a27;box-shadow:0 20px 60px rgba(0,0,0,.28);margin-bottom:18px}.hero img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.heroShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 25%,rgba(2,10,16,.88) 100%)}.heroCopy{position:absolute;left:20px;right:20px;bottom:18px}.eyebrow{font-size:12px;color:#9acaff;letter-spacing:.13em;text-transform:uppercase;font-weight:700}.hero h1{font-size:30px;line-height:1.05;margin:6px 0}.hero p{margin:0;color:#d1dde8}.sectionTitle{font-size:23px;font-weight:800;margin:20px 2px 10px}.sub{color:var(--muted);font-size:14px;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.navcard{padding:17px;border-radius:20px;background:linear-gradient(145deg,#112a3e,#0b1c2a);border:1px solid var(--line);min-height:98px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.18)}.navcard .ico{font-size:25px}.navcard strong{display:block;margin-top:8px;font-size:16px}.navcard small{display:block;margin-top:4px;color:var(--muted)}
.car{overflow:hidden;background:linear-gradient(145deg,#0d2232,#091824);border:1px solid var(--line);border-radius:24px;margin:14px 0;box-shadow:0 15px 40px rgba(0,0,0,.22)}.car img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}.carbody{padding:15px}.carline{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.carname{font-size:19px;font-weight:800}.from{font-size:14px;color:#9bcfff;text-align:right;white-space:nowrap}.from b{display:block;font-size:18px;color:#fff}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.chip{padding:7px 9px;border-radius:10px;background:rgba(255,255,255,.06);color:#c9d5df;font-size:12px}.primary{width:100%;padding:14px 16px;border-radius:15px;background:linear-gradient(135deg,var(--blue),#0561d2);font-weight:800;box-shadow:0 10px 24px rgba(22,131,255,.24)}.secondary{width:100%;padding:13px 16px;border-radius:15px;background:rgba(255,255,255,.055);border:1px solid var(--line);font-weight:700}.row{display:flex;gap:10px}.row>*{flex:1}.back{margin:6px 0 14px;color:#9bcfff;background:none;font-weight:700;padding:6px 0}.detailImg{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:24px;border:1px solid var(--line);display:block}.detailTitle{font-size:27px;margin:15px 0 5px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.fact{padding:12px;border-radius:15px;background:rgba(255,255,255,.045);border:1px solid var(--line);font-size:12px;color:var(--muted)}.fact b{display:block;color:#fff;font-size:14px;margin-top:5px}.block{padding:16px;border-radius:20px;background:rgba(255,255,255,.035);border:1px solid var(--line);margin:12px 0}.block h3{margin:0 0 9px;font-size:16px}.tariffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tariff{padding:12px;border-radius:14px;background:#0c2030;border:1px solid var(--line)}.tariff span{display:block;color:var(--muted);font-size:11px}.tariff b{display:block;margin-top:6px;font-size:15px}
.calendar{background:#0b1b29;border:1px solid var(--line);border-radius:22px;padding:13px}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calhead button{background:rgba(255,255,255,.06);width:40px;height:40px;border-radius:12px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;color:var(--muted);font-size:11px;padding:5px 0}.day{min-height:42px;border-radius:12px;background:rgba(255,255,255,.035);display:flex;align-items:center;justify-content:center;border:1px solid transparent;font-size:13px}.day.free{background:#0e2435}.day.busy{color:#66798b;background:#101a22}.day.selected{background:var(--blue);font-weight:800}.day.disabled{opacity:.25}.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.time{padding:12px 4px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:13px}.time.selected{background:var(--blue);font-weight:800}.summary{margin-top:14px;padding:17px;border-radius:20px;background:linear-gradient(145deg,#102b40,#0b1b29);border:1px solid rgba(62,159,255,.25)}.summary .big{font-size:28px;font-weight:900;margin-top:4px}.hint{color:var(--amber);font-size:12px;line-height:1.4;margin-top:7px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#091824;color:#fff;border-radius:14px;padding:13px;font:inherit;outline:none}.field textarea{min-height:88px;resize:vertical}.bookingCard{padding:17px;border-radius:20px;background:linear-gradient(145deg,#102638,#0a1926);border:1px solid var(--line);margin:12px 0}.status{display:inline-flex;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.07);font-size:11px}.ok{color:#74f0aa}.warn{color:#ffd278}.danger{color:#ff8d98}.toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;padding:13px 15px;border-radius:16px;background:#122637;border:1px solid var(--line);box-shadow:0 16px 40px #0008;display:none}.toast.show{display:block;animation:in .2s ease}.empty{text-align:center;padding:40px 20px;color:var(--muted)}
@media(min-width:650px){.hero h1{font-size:38px}.car{display:grid;grid-template-columns:1.2fr 1fr}.car img{height:100%;aspect-ratio:auto}.carbody{display:flex;flex-direction:column;justify-content:center}}

/* CABINET 2.0 */
.bookingHero{padding:16px;border-radius:22px;background:linear-gradient(135deg,rgba(22,131,255,.10),rgba(43,213,118,.08));border:1px solid rgba(22,131,255,.20);margin:14px 0}
.bookingHero .heroLine{display:flex;justify-content:space-between;gap:10px;align-items:center}
.bookingHero .heroTitle{font-size:18px;font-weight:900}

.bookingCardTop{display:flex;gap:12px;align-items:flex-start}

<div id="app">
<header class="top"><button class="topbtn" id="backBtn" onclick="goBack()">‹</button><div class="brand">BALTICAR</div><button class="topbtn" onclick="goHome()">⌂</button></header>
<section id="home" class="screen active"></section>
<section id="cars" class="screen"></section>
<section id="car" class="screen"></section>
<section id="calendar" class="screen"></section>
<section id="form" class="screen"></section>
<section id="done" class="screen"></section>
<section id="bookings" class="screen"></section>
<section id="reviews" class="screen"></section>

</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){
  function applyTheme(){
    const tg=window.Telegram?.WebApp;
    const scheme=tg?.colorScheme || (window.matchMedia?.('(prefers-color-scheme: light)').matches?'light':'dark');
    document.documentElement.classList.toggle('light', scheme==='light');
    document.documentElement.classList.toggle('dark', scheme!=='light');
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta) meta.content=scheme==='light'?'#f4f7fa':'#06101a';
    try{
      tg?.setHeaderColor?.(scheme==='light'?'#f4f7fa':'#06101a');
      tg?.setBackgroundColor?.(scheme==='light'?'#f4f7fa':'#06101a');
    }catch(e){}
  }
  window.BALTICAR_applyTheme=applyTheme;
  applyTheme();
  if(window.Telegram?.WebApp?.onEvent){
    try{ window.Telegram.WebApp.onEvent('themeChanged', applyTheme); }catch(e){}
  }
  const mq=window.matchMedia?.('(prefers-color-scheme: light)');
  try{mq?.addEventListener?.('change', applyTheme)}catch(e){}
})();
</script>
<script>
const tg=window.Telegram?.WebApp; try{tg?.ready();tg?.expand();window.BALTICAR_applyTheme?.()}catch(e){}
const $=id=>document.getElementById(id); let current='home', history=[]; let cars=[],selectedCar=null,startDate=null,startTime=null,endDate=null,endTime=null,month=new Date(); let pickupLocation='airport'; let pickupLocationNote='';
const headers=()=>({'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''});
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{} if(!r.ok)throw new Error(d.message||'Ошибка сервера');return d}
function money(n){return new Intl.NumberFormat('ru-RU').format(n)+' ₽'}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}
function show(id,push=true){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(push&&current!==id)history.push(current);current=id;window.scrollTo({top:0,behavior:'smooth'});$('backBtn').style.visibility=id==='home'?'hidden':'visible'}

const BUFFER_MS=2*60*60*1000;

      const shownStatus=completed?'completed':b.status;
      const guide=completed?'✓ Аренда завершена. Спасибо, что выбрали BALTICAR.':b.status==='confirmed'?'✓ Бронь подтверждена. Менеджер согласует точную точку встречи.':b.status==='pending'?'⏳ Заявка ожидает подтверждения. После подтверждения менеджер свяжется с вами.':b.status==='cancelled'?'Бронь отменена.':'Статус заявки обновлён.';
      return `<div class="bookingCard"><div class="bookingCardTop">${c?`<img class="bookingCarThumb" src="${img(c.photos?.[0])}" alt="">`:''}<div class="bookingCardInfo"><div class="bookingNo">Бронирование №${b.id}</div><b>${escapeHtml(b.car_name)}</b><div style="margin-top:6px"><span class="status">${status(shownStatus)}</span></div></div></div><div class="bookingFacts"><div class="bookingFact"><span>Получение</span><b>${escapeHtml(b.start_at)}</b></div><div class="bookingFact"><span>Возврат</span><b>${escapeHtml(b.end_at)}</b></div></div><div class="priceBreak"><div class="priceRow"><span>Стоимость аренды</span><b>${money(b.total)}</b></div><div class="priceRow"><span>Залог</span><b>10 000 ₽</b></div><div class="priceRow"><span>Место подачи</span><span>${escapeHtml(b.pickup_location||'Калининград')}</span></div>${b.pickup_location_fee===0?'<div class="priceRow"><span>Подача</span><b>БЕСПЛАТНО</b></div>':b.pickup_location_fee!=null?`<div class="priceRow"><span>Подача</span><b>от 1 000 ₽</b></div>`:''}</div>${b.comment?`<div class="sub" style="margin-top:10px">📝 ${escapeHtml(b.comment)}</div>`:''}<div class="bookingStatusBox ${shownStatus==='confirmed'?'confirmed':''} ${completed?'completed':''}">${guide}</div><div class="detailActions">${canReview?`<button class="primary" onclick="openReviewForm(${b.id})">⭐ Оставить отзыв</button>`:''}${['pending','confirmed'].includes(b.status)&&!b.past?`<button class="secondary" onclick="cancelBooking(${b.id})">Отменить бронь</button>`:''}<div class="row"><button class="secondary" onclick="openMap()">🗺 Карта</button><button class="secondary" onclick="openContact()">💬 Менеджер</button></div></div></div>`
    }).join('');
  }catch(e){$('blist').innerHTML='<div class="empty">'+escapeHtml(e.message)+'</div>'}
}
function startCountdown(id,value){
  const el=$('countdown-'+id);if(!el)return;
  const tick=()=>{const d=new Date(value);const ms=d.getTime()-Date.now();if(!Number.isFinite(ms)){el.firstChild.textContent='Ближайшее получение: '+value;return}if(ms<=0){el.firstChild.textContent='Автомобиль уже должен быть выдан';return}const days=Math.floor(ms/86400000),hrs=Math.floor(ms%86400000/3600000),mins=Math.floor(ms%3600000/60000);el.firstChild.textContent=days?`До получения — ${days} дн. ${hrs} ч.`:`До получения — ${hrs} ч. ${mins} мин.`};tick();setInterval(tick,60000)
}

function status(s){return ({pending:'🟡 Ожидает',confirmed:'🟢 Подтверждена',completed:'🔵 Завершена',cancelled:'⚫ Отменена',rejected:'🔴 Отклонена',expired:'⚪ Истекла'})[s]||s}
async function cancelBooking(id){if(!confirm('Отменить бронирование №'+id+'?'))return;try{await api('/api/bookings/cancel',{method:'POST',body:JSON.stringify({id})});toast('Бронирование отменено');openBookings()}catch(e){toast(e.message)}}
async function openReviews(){show('reviews');$('reviews').innerHTML='<div class="sectionTitle">Отзывы клиентов</div><div class="sub">Реальные впечатления о BALTICAR.</div><div id="rlist">Загрузка…</div>';try{const d=await api('/api/reviews');$('rlist').innerHTML=d.reviews.length?d.reviews.map(r=>`<div class="bookingCard"><div style="font-size:20px">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><div style="margin-top:8px">${escapeHtml(r.text)||'Без текста'}</div><div class="sub" style="margin-top:8px">${escapeHtml(r.name)} · ${escapeHtml(r.car_name)} · ${r.created_at}</div></div>`).join(''):'<div class="empty">Пока нет отзывов.</div>'}catch(e){$('rlist').innerHTML='<div class="empty">'+e.message+'</div>'}}
function openWhy(){show('why');$('why').innerHTML='<div class="sectionTitle">Почему BALTICAR</div><div class="sub">Сервис, который хочется рекомендовать.</div>'+[['🛡','Проверенные автомобили','Следим за состоянием, чистотой и обслуживанием.'],['💰','Прозрачные тарифы','Цена зависит от срока и видна до отправки заявки.'],['⚡','Быстрое подтверждение','Менеджер получает заявку сразу после отправки.'],['📅','Удобное бронирование','Весь путь от автомобиля до заявки — в одном окне.'],['🔔','Напоминания','Бот напомнит о предстоящей аренде заранее.']].map(x=>`<div class="block"><div style="font-size:25px">${x[0]}</div><h3>${x[1]}</h3><div class="sub">${x[2]}</div></div>`).join('')}
function openTerms(){show('terms');$('terms').innerHTML='<div class="sectionTitle">Условия аренды</div><div class="block"><h3>🕐 Время</h3><div class="sub">Выдача и возврат: 08:00–20:00.</div></div><div class="block"><h3>🔧 Технический интервал</h3><div class="sub">Между бронированиями закладывается 2 часа.</div></div><div class="block"><h3>💰 Оплата</h3><div class="sub">Тариф определяется количеством оплачиваемых суток: 1–3, 4–6 или 7+.</div></div><div class="block"><h3>📌 Важно</h3><div class="sub">Если возврат происходит позже полного количества суток, добавляется ещё одни оплачиваемые сутки.</div></div>'}
function openContact(){tg?.openTelegramLink?.('https://t.me/Balticar_kgd')||toast('Откройте канал BALTICAR для связи')}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
renderHome();$('backBtn').style.visibility='hidden';
</script>
</body></html>
