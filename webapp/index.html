function galleryHTML(c,detail=false,prefix=''){const photos=(c.photos||[]).filter(Boolean);const id=(prefix+(detail?'detail-':'card-')+c.id).replace(/[^a-zA-Z0-9_-]/g,'');return `<div class="${detail?'detailGallery':'carGallery'} gallery" data-gallery="${id}" data-index="0" data-photos='${JSON.stringify(photos)}' ontouchstart="galleryTouchStart(event,this)" ontouchend="galleryTouchEnd(event,this)"><img class="galleryImg" src="${img(photos[0])}" alt="${escapeHtml(c.name)}"><button class="galleryBtn prev" type="button" onclick="galleryMove(event,'${id}',-1)">‹</button><button class="galleryBtn next" type="button" onclick="galleryMove(event,'${id}',1)">›</button><div class="galleryCount">1 / ${photos.length||1}</div><div class="galleryDots">${photos.map((_,i)=>`<button class="galleryDot ${i===0?'active':''}" type="button" onclick="gallerySet(event,'${id}',${i})"></button>`).join('')}</div>${detail?`<div class="thumbStrip">${photos.map((ph,i)=>`<button class="thumb ${i===0?'active':''}" onclick="gallerySet(event,'${id}',${i})"><img src="${img(ph)}"></button>`).join('')}</div>`:''}</div>`}
function galleryData(id){return document.querySelector(`[data-gallery="${id}"]`)}
function galleryRender(g,i){const photos=JSON.parse(g.dataset.photos||'[]');if(!photos.length)return;i=(i+photos.length)%photos.length;g.dataset.index=i;g.querySelector('.galleryImg').src=img(photos[i]);g.querySelector('.galleryCount').textContent=`${i+1} / ${photos.length}`;g.querySelectorAll('.galleryDot').forEach((d,n)=>d.classList.toggle('active',n===i));g.querySelectorAll('.thumb').forEach((d,n)=>d.classList.toggle('active',n===i))}
function galleryMove(ev,id,delta){ev.preventDefault();ev.stopPropagation();const g=galleryData(id);if(g)galleryRender(g,Number(g.dataset.index||0)+delta)}
function gallerySet(ev,id,i){ev.preventDefault();ev.stopPropagation();const g=galleryData(id);if(g)galleryRender(g,i)}
function galleryTouchStart(ev,g){g._touchX=ev.changedTouches[0].clientX}
function galleryTouchEnd(ev,g){const x=ev.changedTouches[0].clientX;const dx=x-(g._touchX||x);if(Math.abs(dx)<35)return;galleryRender(g,Number(g.dataset.index||0)+(dx<0?1:-1))}
function renderCars(){ $('carlist').innerHTML='<div class="carlistGrid">'+cars.map(c=>`<article class="car">${galleryHTML(c)}<div class="carbody"><div class="carname">${escapeHtml(c.name)}</div><div class="carSub">${escapeHtml(c.name.replace('Hyundai ',''))}</div><div class="chips"><span class="chip">⚙️ ${escapeHtml(c.gear)}</span><span class="chip">⛽ ${escapeHtml(c.fuel)}</span><span class="chip">👥 ${c.seats} мест</span><span class="chip">⚪ Белый</span></div><div class="priceBox"><span class="small">от</span><div class="price">${money(c.rates[2])}<small>/сутки</small></div><span class="small">при аренде от 7 суток</span></div><button class="roundArrow" onclick="openCar('${c.id}')">→</button></div></article>`).join('')+'</div>'}

function renderCar(){const c=selectedCar;$('car').innerHTML=`<div class="mockHeader"><button onclick="openCars()">‹</button><b>${escapeHtml(c.name)}</b><span>♡</span></div>${galleryHTML(c,true,'detail-')}<div class="detailInfo"><h1>${escapeHtml(c.name)}</h1><div class="sub">${escapeHtml(c.name.includes('2021')?'2021 · 1.6 · МКПП':c.name.includes('2020')?'2020 · 1.6 · АКПП':c.name.includes('2017')?'2017 · 1.4 · АКПП':'2014 · 1.6 · МКПП')}</div><div class="miniFacts"><span>♙ ${c.seats} мест</span><span>▣ ${escapeHtml(c.fuel)}</span></div><div class="detailSection"><h3>Характеристики</h3><div class="specRows"><div><span>⚙ КПП</span><b>${escapeHtml(c.gear==='МКПП'?'Механическая':'Автоматическая')}</b></div><div><span>⛽ Топливо</span><b>${escapeHtml(c.fuel)}</b></div><div><span>♙ Вместимость</span><b>${c.seats} мест</b></div></div></div><div class="detailBottom"><b>от ${money(c.rates[2])}/сутки</b><button class="darkPrimary" onclick="startBooking()">Забронировать</button></div></div>`}

function startBooking(){startDate=startTime=endDate=endTime=null;month=new Date();show('calendar');renderCalendar('start')}
async function getSlots(mode){
  let url=`/api/slots?car_id=${encodeURIComponent(selectedCar.id)}&year=${month.getFullYear()}&month=${month.getMonth()+1}`;
  if(mode==='end'&&startDate&&startTime!=null) url+=`&start_at=${encodeURIComponent(localIso(startDate,startTime))}`;
  return api(url);
}
function fmtDate(d){return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})}
function localIso(d,h){const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(h)}:00`}
let currentSlots={mode:'start',slots:{}};
function dateKey(d){const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}
function availableHours(d){return currentSlots.slots?.[dateKey(d)]||[]}
function hasHour(d,h){return availableHours(d).includes(h)}
async function renderCalendar(mode){
  $('calendar').innerHTML=`
    <div class="sectionTitle">${mode==='start'?'Дата и время получения':'Дата и время возврата'}</div>
    <div class="sub">${mode==='start'?'Выберите дату и время получения автомобиля.':'Выберите дату и время возврата автомобиля.'}</div>
    <div class="calendar" style="margin-top:14px">
      <div class="calhead">
        <button onclick="shiftMonth(-1,'${mode}')">‹</button>
        <b>${month.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b>
        <button onclick="shiftMonth(1,'${mode}')">›</button>
      </div>
      <div class="week">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div>${x}</div>`).join('')}</div>
      <div id="days" class="days"></div>
      <div id="times"></div>
    </div>
    <div id="calSummary"></div>`;
  try{
    currentSlots=await getSlots(mode);
    drawDays(mode);
  }catch(e){toast(e.message)}
}
async function shiftMonth(delta,mode){month.setMonth(month.getMonth()+delta);await renderCalendar(mode)}
function drawDays(mode){
  const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),today=new Date();
  today.setHours(0,0,0,0);
  let html='';
  const offset=first.getDay()===0?6:first.getDay()-1;
  for(let i=0;i<offset;i++)html+='<div></div>';
  for(let n=1;n<=last.getDate();n++){
    const d=new Date(y,m,n),hasTime=availableHours(d).length>0;
    const dis=d<today || (mode==='end'&&startDate&&d<=startDate) || !hasTime;
    const sel=(mode==='start'&&startDate&&d.toDateString()===startDate.toDateString())||(mode==='end'&&endDate&&d.toDateString()===endDate.toDateString());
    html+=`<button class="day ${hasTime?'free':'busy'} ${dis?'disabled':''} ${sel?'selected':''}" ${dis?'disabled':''} onclick="chooseDay(${n},'${mode}')">${n}</button>`;
  }
  $('days').innerHTML=html;
  if(mode==='start'&&startDate)drawTimes('start');
  if(mode==='end'&&endDate)drawTimes('end');
}
function chooseDay(n,mode){
  const d=new Date(month.getFullYear(),month.getMonth(),n);
  if(mode==='end'&&startDate&&d<=startDate)return;
  if(!availableHours(d).length)return;
  if(mode==='start'){startDate=d;startTime=null;endDate=null;endTime=null}else{endDate=d;endTime=null}
  drawTimes(mode);
}
function drawTimes(mode){
  const box=$('times'),d=mode==='start'?startDate:endDate;
  if(!d){box.innerHTML='';return}
  let html='<div class="sub" style="margin:14px 0 8px">'+fmtDate(d)+'</div><div class="times">';
  for(let h=8;h<=20;h++){
    const ok=hasHour(d,h),selected=(mode==='start'?startTime:endTime)===h;
    html+=`<button class="time ${ok?'available':'unavailable'} ${selected?'selected':''}" ${ok?'':'disabled'} onclick="chooseTime(${h},'${mode}')">${String(h).padStart(2,'0')}:00</button>`;
  }
  html+='</div><div class="sub" style="margin-top:9px;font-size:12px">Светлые — доступно &nbsp; • &nbsp; Затемнённые — занято</div>';
  box.innerHTML=html;
  renderCalSummary();
}
async function chooseTime(h,mode){
  const d=mode==='start'?startDate:endDate;
  if(!d||!hasHour(d,h)){toast('Это время недоступно для выбранного периода');return}
  if(mode==='start'){
    startTime=h;
    endDate=new Date(startDate);endDate.setDate(endDate.getDate()+1);endTime=h;
    month=new Date(endDate.getFullYear(),endDate.getMonth(),1);
    await renderCalendar('end');
  }else{
    endTime=h;
    drawTimes('end');
  }
}
function rentalDays(){if(!startDate||startTime==null||!endDate||endTime==null)return null;const a=new Date(startDate);a.setHours(startTime);const b=new Date(endDate);b.setHours(endTime);return Math.max(1,Math.ceil((b-a)/86400000))}
function rate(){const d=rentalDays();return d<=3?selectedCar.rates[0]:d<=6?selectedCar.rates[1]:selectedCar.rates[2]}
function rateLabel(d){return d<=3?'1–3 суток':d<=6?'4–6 суток':'7+ суток'}
function priceBreakdown(){const d=rentalDays();if(!d)return null;const daily=rate();return {days:d,daily,total:d*daily,label:rateLabel(d)}}
function renderCalSummary(){const p=priceBreakdown();if(!p)return;$('calSummary').innerHTML=`<div class="summary"><div class="sub">${fmtDate(startDate)} ${String(startTime).padStart(2,'0')}:00 → ${fmtDate(endDate)} ${String(endTime).padStart(2,'0')}:00</div><div class="priceBreak"><div class="priceRow"><span>${p.days} ${p.days===1?'сутки':'суток'} × ${money(p.daily)}</span><b>${money(p.total)}</b></div><div class="priceRow"><span>Тариф</span><span>${p.label}</span></div></div><div class="big">${money(p.total)}</div>${endTime>startTime&&fmtDate(startDate)!==fmtDate(endDate)?'<div class="hint">⚠️ Возврат позже времени получения — оплачивается дополнительные сутки.</div>':''}<button class="primary" style="margin-top:12px" onclick="goForm()">Продолжить →</button></div>`}
let pickupLocationType='airport',pickupLocationNote='';
function goForm(){if(!rentalDays()){toast('Выберите дату и время возврата');return}openLocation()}

function renderLocation(){const opts=[['airport','✈️','Аэропорт Храброво','Бесплатно','БЕСПЛАТНО'],['station','🚆','Южный вокзал','Бесплатно','БЕСПЛАТНО'],['city','🏙️','Калининград','От 1 000 ₽',''],['region','🗺️','Калининградская область','От 1 000 ₽',''],['other','📍','Другое место','По запросу','']];$('location').innerHTML=`<div class="mockHeader"><button onclick="goBack()">‹</button><b>Место подачи автомобиля</b><span></span></div><div class="screenLead"><b>Выберите удобное место подачи</b></div><div class="locationList">${opts.map(o=>`<button class="locationOption ${pickupLocationType===o[0]?'selected':''}" onclick="selectLocation('${o[0]}')"><span class="locIcon">${o[1]}</span><span class="locMain"><b>${o[2]}</b><small>${o[3]}</small></span>${o[4]?`<span class="locTag">${o[4]}</span>`:''}<span class="radio"></span></button>`).join('')}</div><div class="infoBox">Для города и области стоимость может отличаться в зависимости от конкретного адреса. Точную сумму согласует менеджер.</div>${pickupLocationType==='other'?`<div class="field"><label>Адрес или комментарий</label><textarea id="locationNote" placeholder="Укажите адрес места подачи">${escapeHtml(pickupLocationNote)}</textarea></div>`:''}<button class="darkPrimary" onclick="continueFromLocation()">Далее</button>`}
function selectLocation(type){if($('locationNote'))pickupLocationNote=$('locationNote').value.trim();pickupLocationType=type;renderLocation()}
function continueFromLocation(){if($('locationNote'))pickupLocationNote=$('locationNote').value.trim();if(pickupLocationType==='other'&&!pickupLocationNote){toast('Укажите адрес другого места');return}show('form');renderForm()}
function renderForm(){const p=priceBreakdown();const locs={airport:'Аэропорт Храброво',station:'Южный вокзал',city:'Калининград',region:'Калининградская область',other:'Другое место'};const free=['airport','station'].includes(pickupLocationType);const locFee=free?0:1000;$('form').innerHTML=`<div class="mockHeader"><button onclick="goBack()">‹</button><b>Оформление бронирования</b><span></span></div><div class="orderCard"><div class="orderCar"><img src="${img(selectedCar.photos?.[0])}"><div><b>${escapeHtml(selectedCar.name)}</b><small>${escapeHtml(selectedCar.name.includes('2021')?'2021 · 1.6 · МКПП':'Автомобиль BALTICAR')}</small></div></div><div class="orderRows"><div><span>▣ Получение</span><b>${fmtDate(startDate)} · ${String(startTime).padStart(2,'0')}:00</b></div><div><span>▣ Возврат</span><b>${fmtDate(endDate)} · ${String(endTime).padStart(2,'0')}:00</b></div><div><span>✈ Место подачи</span><b>${locs[pickupLocationType]}</b><small>${free?'Бесплатно':''}</small></div></div></div><div class="orderCard"><h3>Стоимость</h3><div class="priceRow"><span>Аренда (${p.days} ${p.days===1?'сутки':'суток'})</span><b>${money(p.total)}</b></div><div class="priceRow"><span>Подача</span><b>${free?'0 ₽':'от 1 000 ₽'}</b></div><div class="totalRow"><b>Итого</b><b>${free?money(p.total):'от '+money(p.total+locFee)}</b></div><div class="depositLine">🔐 Залог (возвращается) <b>10 000 ₽</b></div></div><div class="field"><label>Ваше имя</label><input id="name" placeholder="Имя"></div><div class="field"><label>Телефон</label><input id="phone" type="tel" placeholder="+7 ..."></div><div class="field"><label>Дополнительные пожелания</label><textarea id="comment" placeholder="Необязательно"></textarea></div><button class="secondary" onclick="openLocation()">← Изменить место подачи</button><button class="darkPrimary" style="margin-top:9px" onclick="submitBooking()">Забронировать</button>`}
async function submitBooking(){const name=$('name').value.trim(),phone=$('phone').value.trim(),comment=$('comment').value.trim();if(!name||phone.length<7){toast('Введите имя и корректный телефон');return}const a=localIso(startDate,startTime),b=localIso(endDate,endTime);try{const r=await api('/api/bookings',{method:'POST',body:JSON.stringify({car_id:selectedCar.id,start_at:a,end_at:b,name,phone,comment,pickup_location_type:pickupLocationType,pickup_location_note:pickupLocationNote})});$('done').innerHTML=`<div class="mockHeader"><button onclick="goHome()">‹</button><b>Итог заказа</b><span></span></div><div class="orderCard"><div class="orderCar"><img src="${img(selectedCar.photos?.[0])}"><div><b>${escapeHtml(selectedCar.name)}</b><small>${escapeHtml(selectedCar.name.includes('2021')?'2021 · 1.6 · МКПП':'Автомобиль BALTICAR')}</small></div></div><div class="orderRows"><div><span>▣ Получение</span><b>${fmtDate(startDate)} · ${String(startTime).padStart(2,'0')}:00</b></div><div><span>▣ Возврат</span><b>${fmtDate(endDate)} · ${String(endTime).padStart(2,'0')}:00</b></div><div><span>✈ Место подачи</span><b>${escapeHtml(r.location||'Аэропорт Храброво')}</b><small>${['Аэропорт Храброво','Южный вокзал'].includes(r.location)?'Бесплатно':''}</small></div></div></div><div class="orderCard"><h3>Стоимость</h3><div class="priceRow"><span>Аренда (${r.days} ${r.days===1?'сутки':'суток'})</span><b>${money(r.total)}</b></div><div class="priceRow"><span>Подача</span><b>${r.location_fee===0?'0 ₽':'По согласованию'}</b></div><div class="totalRow"><b>Итого</b><b>${money(r.total)}</b></div><div class="depositLine">🔐 Залог (возвращается) <b>10 000 ₽</b></div></div><div class="successBox"><b>✓ Заявка отправлена</b><span>№${r.id}. Менеджер подтвердит бронь и свяжется с вами для согласования деталей.</span></div><button class="darkPrimary" onclick="openBookings()">Мои брони</button><button class="secondary" style="margin-top:9px" onclick="goHome()">Главная</button>`;show('done');tg?.HapticFeedback?.notificationOccurred('success')}catch(e){toast(e.message)}}
async function openBookings(){show('bookings');$('bookings').innerHTML='<div class="sectionTitle">Личный кабинет</div><div class="sub">Все ваши бронирования, статусы и детали — в одном месте.</div><div id="blist">Загрузка…</div>';try{const d=await api('/api/mybookings');if(!d.bookings.length){$('blist').innerHTML='<div class="empty">Пока нет бронирований.<br><button class="primary" style="margin-top:16px" onclick="openCars()">Выбрать автомобиль</button></div>';return}$('blist').innerHTML=d.bookings.map(b=>{const canReview=b.status==='confirmed'&&b.past&&!b.reviewed;return `<div class="bookingCard"><div style="display:flex;justify-content:space-between;gap:10px"><b>№${b.id}</b><span class="status">${status(b.status)}</span></div><div style="font-size:18px;font-weight:800;margin-top:8px">${escapeHtml(b.car_name)}</div><div class="bookingMeta"><div class="metaBox"><span>Получение</span><b>${b.start_at}</b></div><div class="metaBox"><span>Возврат</span><b>${b.end_at}</b></div></div><div class="priceBreak" style="margin-top:12px"><div class="priceRow"><span>Стоимость аренды</span><b>${money(b.total)}</b></div><div class="priceRow"><span>Место подачи</span><span>${escapeHtml(b.pickup_location||'Аэропорт Храброво')}</span></div></div>${b.comment?`<div class="sub" style="margin-top:10px">📝 ${escapeHtml(b.comment)}</div>`:''}<div class="statusGuide">${b.status==='confirmed'?'<b>✓ Бронь подтверждена.</b> Менеджер согласует точную точку встречи. Перед арендой вы получите напоминание.':'<b>⏳ Заявка ожидает подтверждения.</b> После подтверждения менеджер свяжется с вами для согласования места встречи.'}</div><div class="detailActions">${canReview?`<button class="primary" onclick="openReviewForm(${b.id})">⭐ Оставить отзыв</button>`:''}${['pending','confirmed'].includes(b.status)?`<button class="secondary" onclick="cancelBooking(${b.id})">Отменить бронь</button>`:''}<button class="secondary" onclick="openMap()">🗺 Карта получения</button></div></div>`}).join('')}catch(e){$('blist').innerHTML='<div class="empty">'+escapeHtml(e.message)+'</div>'}}
function status(s){return ({pending:'🟡 Ожидает',confirmed:'🟢 Подтверждена',cancelled:'⚫ Отменена',rejected:'🔴 Отклонена',expired:'⚪ Истекла'})[s]||s}
async function cancelBooking(id){if(!confirm('Отменить бронирование №'+id+'?'))return;try{await api('/api/bookings/cancel',{method:'POST',body:JSON.stringify({id})});toast('Бронирование отменено');openBookings()}catch(e){toast(e.message)}}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}
function ratingSummary(list){if(!list.length)return {avg:0,count:0};const avg=list.reduce((s,r)=>s+Number(r.rating||0),0)/list.length;return {avg:Math.round(avg*10)/10,count:list.length}}
async function openReviews(){show('reviews');$('reviews').innerHTML='<div class="sectionTitle">Отзывы клиентов</div><div class="sub">Реальные впечатления о BALTICAR.</div><div class="block" style="margin-top:12px"><h3>⭐ Отзывы на Яндекс Картах</h3><div class="sub">Официальный виджет Яндекса — рейтинг и отзывы BALTICAR прямо внутри Mini App.</div><div class="yandexReviews"><div class="yandexCaption">Отзывы загружаются непосредственно из Яндекс Карт.</div><iframe title="Отзывы BALTICAR на Яндекс Картах" src="https://yandex.ru/maps-reviews-widget/241408506634?comments" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe><div class="yandexActions"><button class="primary" onclick="openYandexReviews()">⭐ Оставить отзыв</button><button class="secondary" onclick="openYandexReviews()">↗ Все отзывы</button></div></div></div><div id="rlist">Загрузка…</div>';try{const d=await api('/api/reviews');const rs=ratingSummary(d.reviews);const hero=rs.count?`<div class="ratingHero"><div class="ratingBig">${rs.avg.toFixed(1)}</div><div><div class="stars" style="font-size:23px">${stars(Math.round(rs.avg))}</div><div class="sub">Средняя оценка · ${rs.count} ${rs.count===1?'отзыв':rs.count<5?'отзыва':'отзывов'}</div></div></div>`:'<div class="ratingHero"><div class="ratingBig">—</div><div><div style="font-weight:800">Пока нет оценок</div><div class="sub">Ваш отзыв может стать первым.</div></div></div>';$('rlist').innerHTML=hero+(d.reviews.length?d.reviews.map(r=>`<div class="bookingCard"><div class="stars" style="font-size:20px">${stars(Number(r.rating))}</div><div style="margin-top:8px">${escapeHtml(r.text)||'Без текста'}</div><div class="sub" style="margin-top:8px">${escapeHtml(r.name)} · ${escapeHtml(r.car_name)} · ${r.created_at}</div></div>`).join(''):'<div class="empty">Пока нет опубликованных отзывов.</div>')}catch(e){$('rlist').innerHTML='<div class="empty">'+escapeHtml(e.message)+'</div>'}}
let reviewRating=5;
async function openReviewForm(bid){show("reviews");$("reviews").innerHTML=`<button class="back" onclick="openBookings()">← В личный кабинет</button><div class="sectionTitle">Ваш отзыв</div><div class="sub">Оцените аренду — это помогает другим клиентам.</div><div class="reviewForm"><div style="font-weight:800">Оценка</div><div class="ratingButtons">${[1,2,3,4,5].map(n=>'<button class="ratingBtn '+(n===5?'selected':'')+'" id="rate'+n+'" onclick="selectReviewRating('+n+')">'+n+' ★</button>').join('')}</div><div class="field"><label>Комментарий</label><textarea id="reviewText" placeholder="Что понравилось? Как прошла аренда?"></textarea></div><button class="primary" onclick="submitReview(${bid})">Опубликовать отзыв</button></div>`}
function selectReviewRating(n){reviewRating=n;[1,2,3,4,5].forEach(x=>$("rate"+x)?.classList.toggle('selected',x===n))}
async function submitReview(bid){const text=$('reviewText').value.trim();try{await api('/api/reviews',{method:'POST',body:JSON.stringify({booking_id:bid,rating:reviewRating,text})});toast('Спасибо за отзыв!');openReviews()}catch(e){toast(e.message)}}

function openWhy(){show('why');$('why').innerHTML='<div class="sectionTitle">Почему BALTICAR</div><div class="sub">Сервис, который хочется рекомендовать.</div>'+[['🛡','Проверенные автомобили','Следим за состоянием, чистотой и обслуживанием.'],['💰','Прозрачные тарифы','Цена зависит от срока и видна до отправки заявки.'],['⚡','Быстрое подтверждение','Менеджер получает заявку сразу после отправки.'],['📅','Удобное бронирование','Весь путь от автомобиля до заявки — в одном окне.'],['🔔','Напоминания','Бот напомнит о предстоящей аренде заранее.']].map(x=>`<div class="block"><div style="font-size:25px">${x[0]}</div><h3>${x[1]}</h3><div class="sub">${x[2]}</div></div>`).join('')}
function openTerms(){show('terms');$('terms').innerHTML='<div class="sectionTitle">Условия аренды</div><div class="block"><h3>👤 Требования к водителю</h3><div class="sub">Возраст от 23 лет.<br>Стаж вождения от 3 лет.</div></div><div class="block"><h3>🕐 Время</h3><div class="sub">Выдача и возврат: 08:00–20:00.</div></div><div class="block"><h3>🔧 Технический интервал</h3><div class="sub">Между бронированиями закладывается 2 часа.</div></div><div class="block"><h3>💰 Оплата</h3><div class="sub">Тариф определяется количеством оплачиваемых суток: 1–3, 4–6 или 7+.<br>Форма оплаты — любая.</div></div><div class="block"><h3>🏢 Для юридических лиц</h3><div class="sub">Работаем с юридическими лицами.</div></div><div class="block"><h3>📌 Важно</h3><div class="sub">Если возврат происходит позже полного количества суток, добавляется ещё одни оплачиваемые сутки.</div></div>'}
function openYandexReviews(){const u='https://yandex.ru/maps/org/balticar/241408506634/reviews/?add-review=true&ll=21.218947%2C54.560111&tab=reviews&z=7'; if(tg?.openLink){tg.openLink(u)}else{window.open(u,'_blank')}}
function openContact(){tg?.openTelegramLink?.('https://t.me/Balticar_kgd')||toast('Откройте канал BALTICAR для связи')}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function applySystemTheme(){
  const dark=(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.colorScheme)?Telegram.WebApp.colorScheme==='dark':window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark',!!dark);
  const meta=document.getElementById('themeColorMeta');
  if(meta) meta.setAttribute('content',dark?'#06101a':'#f5f7fa');
  try{tg?.setHeaderColor?.(dark?'#06101a':'#f5f7fa');tg?.setBackgroundColor?.(dark?'#06101a':'#f5f7fa')}catch(e){}
}
applySystemTheme();
if(window.Telegram?.WebApp){Telegram.WebApp.onEvent?.('themeChanged',applySystemTheme);Telegram.WebApp.ready?.();}
if(window.matchMedia){const mq=window.matchMedia('(prefers-color-scheme: dark)');mq.addEventListener?.('change',applySystemTheme);}
renderHome();$('backBtn').style.visibility='hidden';
</script>
</body></html>
