<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111c">
<title>BALTICAR — аренда автомобилей</title>
<style>
:root{--bg:#06101a;--panel:#0b1b29;--panel2:#102537;--line:rgba(255,255,255,.09);--text:#f5f8fb;--muted:#91a3b5;--blue:#1683ff;--blue2:#0b63d9;--green:#2bd576;--amber:#ffb62b;--danger:#ff5f6d;--radius:22px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}body{background:radial-gradient(900px 500px at 50% -10%,#123657 0,#07131f 55%,#06101a 100%)}button{font:inherit;color:inherit;border:0;cursor:pointer}#app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 12px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent)}.brand{font-weight:800;letter-spacing:.08em;font-size:18px}.brand span{color:#5db1ff}.topbtn{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:19px}.screen{display:none}.screen.active{display:block;animation:in .22s ease}@keyframes in{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:#0b1a27;box-shadow:0 20px 60px rgba(0,0,0,.28);margin-bottom:18px}.hero img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.heroShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 25%,rgba(2,10,16,.88) 100%)}.heroCopy{position:absolute;left:20px;right:20px;bottom:18px}.eyebrow{font-size:12px;color:#9acaff;letter-spacing:.13em;text-transform:uppercase;font-weight:700}.hero h1{font-size:30px;line-height:1.05;margin:6px 0}.hero p{margin:0;color:#d1dde8}.sectionTitle{font-size:23px;font-weight:800;margin:20px 2px 10px}.sub{color:var(--muted);font-size:14px;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.navcard{padding:17px;border-radius:20px;background:linear-gradient(145deg,#112a3e,#0b1c2a);border:1px solid var(--line);min-height:98px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.18)}.navcard .ico{font-size:25px}.navcard strong{display:block;margin-top:8px;font-size:16px}.navcard small{display:block;margin-top:4px;color:var(--muted)}
.car{overflow:hidden;background:linear-gradient(145deg,#0d2232,#091824);border:1px solid var(--line);border-radius:24px;margin:14px 0;box-shadow:0 15px 40px rgba(0,0,0,.22)}.car img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}.carbody{padding:15px}.carline{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.carname{font-size:19px;font-weight:800}.from{font-size:14px;color:#9bcfff;text-align:right;white-space:nowrap}.from b{display:block;font-size:18px;color:#fff}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.chip{padding:7px 9px;border-radius:10px;background:rgba(255,255,255,.06);color:#c9d5df;font-size:12px}.primary{width:100%;padding:14px 16px;border-radius:15px;background:linear-gradient(135deg,var(--blue),#0561d2);font-weight:800;box-shadow:0 10px 24px rgba(22,131,255,.24)}.secondary{width:100%;padding:13px 16px;border-radius:15px;background:rgba(255,255,255,.055);border:1px solid var(--line);font-weight:700}.row{display:flex;gap:10px}.row>*{flex:1}.back{margin:6px 0 14px;color:#9bcfff;background:none;font-weight:700;padding:6px 0}.carGallery,.detailGallery{position:relative;width:100%;overflow:hidden;border-radius:24px;background:#fff;border:1px solid var(--line);touch-action:pan-y}.carGallery{border-radius:24px 24px 0 0;border-left:0;border-right:0;border-top:0}.galleryImg{width:100%;aspect-ratio:3/2;object-fit:contain;display:block;background:#fff;user-select:none;-webkit-user-drag:none}.detailGallery .galleryImg{aspect-ratio:3/2}.galleryBtn{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:1px solid rgba(0,0,0,.12);background:rgba(10,20,30,.72);color:#fff;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:3;padding:0}.galleryBtn.prev{left:10px}.galleryBtn.next{right:10px}.galleryDots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;z-index:3}.galleryDot{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.28);border:0;padding:0}.galleryDot.active{background:#1683ff;transform:scale(1.15)}.galleryCount{position:absolute;right:10px;top:10px;padding:5px 8px;border-radius:10px;background:rgba(10,20,30,.72);color:#fff;font-size:11px;font-weight:700;z-index:3}.detailGallery{margin-bottom:14px}.detailImg{width:100%;aspect-ratio:3/2;object-fit:contain;border-radius:24px;border:1px solid var(--line);display:block;background:#fff}.detailTitle{font-size:27px;margin:15px 0 5px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.fact{padding:12px;border-radius:15px;background:rgba(255,255,255,.045);border:1px solid var(--line);font-size:12px;color:var(--muted)}.fact b{display:block;color:#fff;font-size:14px;margin-top:5px}.block{padding:16px;border-radius:20px;background:rgba(255,255,255,.035);border:1px solid var(--line);margin:12px 0}.block h3{margin:0 0 9px;font-size:16px}.tariffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tariff{padding:12px;border-radius:14px;background:#0c2030;border:1px solid var(--line)}.tariff span{display:block;color:var(--muted);font-size:11px}.tariff b{display:block;margin-top:6px;font-size:15px}
.calendar{background:#0b1b29;border:1px solid var(--line);border-radius:22px;padding:13px}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calhead button{background:rgba(255,255,255,.06);width:40px;height:40px;border-radius:12px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;color:var(--muted);font-size:11px;padding:5px 0}.day{min-height:42px;border-radius:12px;background:rgba(255,255,255,.035);display:flex;align-items:center;justify-content:center;border:1px solid transparent;font-size:13px}.day.free{background:#0e2435}.day.busy{color:#66798b;background:#101a22}.day.selected{background:var(--blue);font-weight:800}.day.disabled{opacity:.25}.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.time{padding:12px 4px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:13px}.time.selected{background:var(--blue);font-weight:800}.summary{margin-top:14px;padding:17px;border-radius:20px;background:linear-gradient(145deg,#102b40,#0b1b29);border:1px solid rgba(62,159,255,.25)}.summary .big{font-size:28px;font-weight:900;margin-top:4px}.hint{color:var(--amber);font-size:12px;line-height:1.4;margin-top:7px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#091824;color:#fff;border-radius:14px;padding:13px;font:inherit;outline:none}.field textarea{min-height:88px;resize:vertical}.bookingCard{padding:17px;border-radius:20px;background:linear-gradient(145deg,#102638,#0a1926);border:1px solid var(--line);margin:12px 0}.status{display:inline-flex;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.07);font-size:11px}.ok{color:#74f0aa}.warn{color:#ffd278}.danger{color:#ff8d98}.toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;padding:13px 15px;border-radius:16px;background:#122637;border:1px solid var(--line);box-shadow:0 16px 40px #0008;display:none}.toast.show{display:block;animation:in .2s ease}.empty{text-align:center;padding:40px 20px;color:var(--muted)}.dateConfirm{margin-top:10px;padding:13px 14px;border-radius:14px;background:#18344b!important;border:1px solid #315d7d!important;color:#ffffff!important;font-size:17px;font-weight:800;line-height:1.5;letter-spacing:.01em;text-shadow:0 1px 1px rgba(0,0,0,.35)}.dateConfirm b{color:#ffffff!important;font-weight:900}.dateConfirm .arrow{color:#9fd2ff!important;padding:0 5px;font-weight:900}html.light .dateConfirm{background:#f4f8fc!important;border-color:#d9e4ef!important;color:#14202b!important;text-shadow:none}html.light .dateConfirm b{color:#0d1b28!important}html.light .dateConfirm .arrow{color:#1675d1!important}.summary .dateConfirm{background:#18344b!important;color:#fff!important;border-color:#3d7399!important}.summary .dateConfirm b{color:#fff!important}.summary .dateConfirm .arrow{color:#a7d8ff!important}@media(max-width:430px){.dateConfirm{font-size:16px;line-height:1.65;word-break:normal}.dateConfirm .arrow{padding:0 3px}}
@media(min-width:650px){.hero h1{font-size:38px}.car{display:grid;grid-template-columns:1.2fr 1fr}.car img{height:100%;aspect-ratio:auto}.carbody{display:flex;flex-direction:column;justify-content:center}}

/* BALTICAR UX upgrade: car cards + booking confirmation */
.carbody{padding:16px}.carTop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}.onlineLabel{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:rgba(43,213,118,.12);border:1px solid rgba(43,213,118,.28);color:#72efaa;font-size:11px;font-weight:800;white-space:nowrap}.carDescription{margin:8px 0 11px;color:#b9c9d6;font-size:13px;line-height:1.45}.carPrice{padding:11px 12px;border-radius:15px;background:rgba(22,131,255,.09);border:1px solid rgba(62,159,255,.22);margin:11px 0 12px}.carPrice .label{font-size:11px;color:#91bde3}.carPrice b{display:block;font-size:21px;color:#fff;margin-top:2px}.carPrice small{display:block;color:#91a3b5;margin-top:2px}.carActions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.carActions .primary,.carActions .secondary{margin:0}.confirmCard{padding:18px;border-radius:24px;background:linear-gradient(145deg,#102d43,#0b1b29);border:1px solid rgba(62,159,255,.3);box-shadow:0 18px 45px rgba(0,0,0,.2);margin:14px 0}.confirmHeader{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.confirmHeader .eyebrow{margin-top:2px}.confirmNumber{font-size:12px;color:#9bcfff;background:rgba(255,255,255,.06);border:1px solid var(--line);padding:7px 9px;border-radius:10px;white-space:nowrap}.confirmCar{font-size:21px;font-weight:900;margin:12px 0 3px}.confirmRow{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13px}.confirmRow span{color:#91a3b5}.confirmRow b{text-align:right;color:#fff}.confirmTotal{margin-top:8px;padding-top:13px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;align-items:end;gap:12px}.confirmTotal span{color:#91a3b5;font-size:12px}.confirmTotal b{font-size:28px;color:#fff}.nextBox{padding:15px 16px;border-radius:18px;background:rgba(43,213,118,.08);border:1px solid rgba(43,213,118,.2);margin-top:12px}.nextBox b{display:block;color:#78f0ad;margin-bottom:5px}.nextBox div{color:#c5d3de;font-size:13px;line-height:1.5}.formStepper{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0 16px}.stepPill{padding:8px 6px;text-align:center;border-radius:10px;background:rgba(255,255,255,.05);color:#7f93a5;font-size:11px;font-weight:700;border:1px solid var(--line)}.stepPill.active{background:rgba(22,131,255,.16);border-color:rgba(22,131,255,.38);color:#8fc8ff}
html.light .carDescription{color:#526779}html.light .onlineLabel{color:#16844b;background:#e9f9f0;border-color:#b8e8cb}html.light .carPrice{background:#f1f7fc;border-color:#cfe1f1}html.light .carPrice b{color:#132333}html.light .confirmCard{background:#f5f9fc;border-color:#cfe0ee;box-shadow:0 12px 32px rgba(24,65,96,.12)}html.light .confirmCar,html.light .confirmRow b,html.light .confirmTotal b{color:#132333}html.light .confirmRow span,html.light .confirmTotal span{color:#607487}html.light .nextBox{background:#edf9f2;border-color:#bde7cc}html.light .nextBox b{color:#167848}html.light .nextBox div{color:#3f5a6c}
@media(max-width:430px){.carActions{grid-template-columns:1fr}.confirmTotal b{font-size:25px}.confirmRow{font-size:12px}}
</style>
</head>
<body>
<div id="app">
<header class="top"><button class="topbtn" id="backBtn" onclick="goBack()">‹</button><div class="brand">BALTICAR</div><button class="topbtn" onclick="goHome()">⌂</button></header>
<section id="home" class="screen active"></section>
<section id="cars" class="screen"></section>
<section id="car" class="screen"></section>
<section id="calendar" class="screen"></section>
<section id="form" class="screen"></section>
<section id="done" class="screen"></section>
<section id="bookings" class="screen"></section>
<section id="reviews" class="screen"></section>
<section id="why" class="screen"></section>
<section id="terms" class="screen"></section>
<div class="toast" id="toast"></div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg=window.Telegram?.WebApp; try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#06101a');tg?.setBackgroundColor?.('#06101a')}catch(e){}
const $=id=>document.getElementById(id); let current='home', history=[]; let cars=[],selectedCar=null,startDate=null,startTime=null,endDate=null,endTime=null,month=new Date();
const headers=()=>({'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''});
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{} if(!r.ok)throw new Error(d.message||'Ошибка сервера');return d}
function money(n){return new Intl.NumberFormat('ru-RU').format(n)+' ₽'}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}
function show(id,push=true){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(push&&current!==id)history.push(current);current=id;window.scrollTo({top:0,behavior:'smooth'});$('backBtn').style.visibility=id==='home'?'hidden':'visible'}
function goBack(){const x=history.pop()||'home';show(x,false)} function goHome(){history=[];show('home',false);renderHome()}
function img(path){return path ? '/' + path.replace(/^\/+/, '') : '/photos/balticar_hero.jpg'}
function renderHome(){ $('home').innerHTML=`<div class="hero"><img src="/photos/balticar_hero.jpg"><div class="heroShade"></div><div class="heroCopy"><div class="eyebrow">BALTICAR • RENT A CAR</div><h1>Аренда автомобилей</h1><p>Калининград и область</p></div></div><div class="sectionTitle">Выберите автомобиль</div><div class="sub">Чистые автомобили, прозрачные тарифы и онлайн-бронирование без лишних звонков.</div><div class="grid" style="margin-top:14px"><button class="navcard" onclick="openCars()"><span class="ico">🚗</span><strong>Автомобили</strong><small>Каталог и цены</small></button><button class="navcard" onclick="openBookings()"><span class="ico">📋</span><strong>Мои брони</strong><small>Статус и детали</small></button><button class="navcard" onclick="openReviews()"><span class="ico">⭐</span><strong>Отзывы</strong><small>Что говорят клиенты</small></button><button class="navcard" onclick="openWhy()"><span class="ico">✨</span><strong>Почему BALTICAR</strong><small>Наши преимущества</small></button></div><div class="row" style="margin-top:12px"><button class="secondary" onclick="openTerms()">ℹ️ Условия</button><button class="secondary" onclick="openContact()">📞 Связаться</button></div>`}
async function openCars(){show('cars');$('cars').innerHTML='<div class="sectionTitle">Автомобили</div><div class="sub">Выберите автомобиль — далее покажем свободные даты и точную стоимость.</div><div id="carlist">Загрузка…</div>';try{cars=(await api('/api/cars')).cars;renderCars()}catch(e){$('carlist').innerHTML='<div class="empty">Не удалось загрузить автомобили.<br>'+e.message+'</div>'}}
function galleryHTML(c,detail=false){const photos=(c.photos||[]).filter(Boolean);const id=(detail?'detail-':'card-')+c.id;if(!photos.length)return `<div class="${detail?'detailGallery':'carGallery'} gallery"><div class="empty">Фото автомобиля пока недоступны</div></div>`;return `<div class="${detail?'detailGallery':'carGallery'} gallery" data-gallery="${id}" data-index="0" data-photos='${JSON.stringify(photos)}' ontouchstart="galleryTouchStart(event,this)" ontouchend="galleryTouchEnd(event,this)"><img class="galleryImg" src="${img(photos[0])}" alt="${escapeHtml(c.name)}"><button class="galleryBtn prev" type="button" onclick="galleryMove(event,'${id}',-1)">‹</button><button class="galleryBtn next" type="button" onclick="galleryMove(event,'${id}',1)">›</button><div class="galleryCount">1 / ${photos.length}</div><div class="galleryDots">${photos.map((_,i)=>`<button class="galleryDot ${i===0?'active':''}" type="button" onclick="gallerySet(event,'${id}',${i})"></button>`).join('')}</div></div>`}
function galleryData(id){return document.querySelector(`[data-gallery="${id}"]`)}
function galleryRender(g,i){const photos=JSON.parse(g.dataset.photos||'[]');if(!photos.length)return;i=(i+photos.length)%photos.length;g.dataset.index=i;g.querySelector('.galleryImg').src=img(photos[i]);g.querySelector('.galleryCount').textContent=`${i+1} / ${photos.length}`;g.querySelectorAll('.galleryDot').forEach((d,n)=>d.classList.toggle('active',n===i))}
function galleryMove(ev,id,delta){ev.preventDefault();ev.stopPropagation();const g=galleryData(id);if(g)galleryRender(g,Number(g.dataset.index||0)+delta)}
function gallerySet(ev,id,i){ev.preventDefault();ev.stopPropagation();const g=galleryData(id);if(g)galleryRender(g,i)}
function galleryTouchStart(ev,g){g._touchX=ev.changedTouches[0].clientX}
function galleryTouchEnd(ev,g){const x=ev.changedTouches[0].clientX;const dx=x-(g._touchX||x);if(Math.abs(dx)<35)return;galleryRender(g,Number(g.dataset.index||0)+(dx<0?1:-1))}
function renderCars(){ $('carlist').innerHTML=cars.map(c=>`<article class="car">${galleryHTML(c)}<div class="carbody"><div class="carTop"><div class="carname">${escapeHtml(c.name)}</div><span class="onlineLabel">● Онлайн-бронирование</span></div><div class="carDescription">${escapeHtml(c.description)}</div><div class="chips"><span class="chip">⚙️ ${escapeHtml(c.gear)}</span><span class="chip">⛽ ${escapeHtml(c.fuel)}</span><span class="chip">👥 ${c.seats} мест</span></div><div class="carPrice"><span class="label">Лучшая цена при аренде от 7 суток</span><b>${money(c.rates[2])}</b><small>за сутки</small></div><div class="carActions"><button class="secondary" onclick="openCar('${c.id}')">Подробнее</button><button class="primary" onclick="openCar('${c.id}')">Забронировать →</button></div></div></article>`).join('')}
function openCar(id){selectedCar=cars.find(x=>x.id===id);show('car');renderCar()}
function renderCar(){const c=selectedCar;$('car').innerHTML=`<button class="back" onclick="openCars()">← К автомобилям</button>${galleryHTML(c,true)}<h1 class="detailTitle">${escapeHtml(c.name)}</h1><div class="sub">${c.description}</div><div class="facts"><div class="fact">Коробка<b>${c.gear}</b></div><div class="fact">Топливо<b>${c.fuel}</b></div><div class="fact">Мест<b>${c.seats}</b></div></div><div class="block"><h3>✨ В стоимость входит</h3><div class="sub">✓ Подготовленный автомобиль<br>✓ Понятная стоимость без скрытых доплат<br>✓ Техническое обслуживание<br>✓ Поддержка менеджера</div></div><div class="block"><h3>💰 Тарифы</h3><div class="tariffs"><div class="tariff"><span>1–3 суток</span><b>${money(c.rates[0])}</b></div><div class="tariff"><span>4–6 суток</span><b>${money(c.rates[1])}</b></div><div class="tariff"><span>7+ суток</span><b>${money(c.rates[2])}</b></div></div></div><div class="block"><h3>🕐 Выдача и возврат</h3><div class="sub">08:00–20:00<br>Технический интервал между арендами — 2 часа.</div></div><button class="primary" onclick="startBooking()">📅 Забронировать</button><div class="row" style="margin-top:10px"><button class="secondary" onclick="openBookings()">📋 Мои брони</button><button class="secondary" onclick="goHome()">⌂ Главное</button></div>`}
function startBooking(){startDate=startTime=endDate=endTime=null;month=new Date();show('calendar');renderCalendar('start')}
async function getAvail(){return api(`/api/availability?car_id=${encodeURIComponent(selectedCar.id)}&year=${month.getFullYear()}&month=${month.getMonth()+1}`)}
function fmtDate(d){return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})}
function localIso(d,h){const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(h)}:00`}
let currentAvail={bookings:[],maintenance:[]};
const BUFFER_MS=2*60*60*1000;
function blocks(){return [...(currentAvail.bookings||[]),...(currentAvail.maintenance||[])]}
function intervalFree(a,b){
  if(!(a instanceof Date)||!(b instanceof Date)||b<=a)return false;
  return !blocks().some(x=>{
    const bs=new Date(x.start_at).getTime()-BUFFER_MS;
    const be=new Date(x.end_at).getTime()+BUFFER_MS;
    return a.getTime()<be && b.getTime()>bs;
  });
}
function candidateStartFree(d,h){
  const a=new Date(d); a.setHours(h,0,0,0);
  const b=new Date(a); b.setDate(b.getDate()+1);
  return intervalFree(a,b);
}
function candidateEndFree(d,h){
  if(!startDate||startTime==null)return false;
  const a=new Date(startDate); a.setHours(startTime,0,0,0);
  const b=new Date(d); b.setHours(h,0,0,0);
  return b>a && intervalFree(a,b);
}
function dayHasAvailableTime(d,mode){
  for(let h=8;h<=20;h++) if(mode==='start'?candidateStartFree(d,h):candidateEndFree(d,h)) return true;
  return false;
}
async function renderCalendar(mode){
  $('calendar').innerHTML=`
    <div class="sectionTitle">${mode==='start'?'Дата и время получения':'Дата и время возврата'}</div>
    <div class="sub">${mode==='start'?'Выберите дату и время получения автомобиля.':'Выберите дату и время возврата автомобиля.'}</div>
    <div class="calendar" style="margin-top:14px">
      <div class="calhead">
        <button onclick="shiftMonth(-1,'${mode}')">‹</button>
        <b>${month.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b>
        <button onclick="shiftMonth(1,'${mode}')">›</button>
      </div>
      <div class="week">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div>${x}</div>`).join('')}</div>
      <div id="days" class="days"></div>
      <div id="times"></div>
    </div>
    <div id="calSummary"></div>`;
  try{currentAvail=await getAvail();drawDays(currentAvail,mode)}catch(e){toast(e.message)}
}
async function shiftMonth(delta,mode){month.setMonth(month.getMonth()+delta);await renderCalendar(mode)}
function drawDays(av,mode){
  currentAvail=av||{bookings:[],maintenance:[]};
  const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),today=new Date();
  today.setHours(0,0,0,0);
  let html='';
  const offset=first.getDay()===0?6:first.getDay()-1;
  for(let i=0;i<offset;i++)html+='<div></div>';
  for(let n=1;n<=last.getDate();n++){
    const d=new Date(y,m,n);
    const hasTime=dayHasAvailableTime(d,mode);
    const dis=d<today || (mode==='end'&&startDate&&d<=startDate) || !hasTime;
    const sel=(mode==='start'&&startDate&&d.toDateString()===startDate.toDateString())||(mode==='end'&&endDate&&d.toDateString()===endDate.toDateString());
    html+=`<button class="day ${hasTime?'free':'busy'} ${dis?'disabled':''} ${sel?'selected':''}" ${dis?'disabled':''} onclick="chooseDay(${n},'${mode}')">${n}</button>`;
  }
  $('days').innerHTML=html;
  if(mode==='start'&&startDate)drawTimes('start');
  if(mode==='end'&&endDate)drawTimes('end');
}
async function chooseDay(n,mode){
  const d=new Date(month.getFullYear(),month.getMonth(),n);
  if(mode==='end'&&startDate&&d<=startDate)return;
  if(!dayHasAvailableTime(d,mode))return;
  if(mode==='start')startDate=d;else endDate=d;
  drawTimes(mode);
}
function drawTimes(mode){
  const box=$('times');
  const d=mode==='start'?startDate:endDate;
  let html='<div class="sub" style="margin:14px 0 8px">'+fmtDate(d)+'</div><div class="times">';
  for(let h=8;h<=20;h++){
    const ok=mode==='start'?candidateStartFree(d,h):candidateEndFree(d,h);
    const selected=(mode==='start'?startTime:endTime)===h;
    html+=`<button class="time ${selected?'selected':''}" ${ok?'':'disabled'} onclick="chooseTime(${h},'${mode}')">${String(h).padStart(2,'0')}:00</button>`;
  }
  html+='</div>';
  box.innerHTML=html;
  renderCalSummary();
}
function chooseTime(h,mode){
  const d=mode==='start'?startDate:endDate;
  const ok=mode==='start'?candidateStartFree(d,h):candidateEndFree(d,h);
  if(!ok){toast('Это время недоступно для выбранного периода');return}
  if(mode==='start')startTime=h;else endTime=h;
  drawTimes(mode);
  if(mode==='start'&&startDate&&startTime!=null){
    endDate=new Date(startDate);endDate.setDate(endDate.getDate()+1);endTime=startTime;
    renderCalendar('end');
  } else renderCalSummary();
}
function rentalDays(){if(!startDate||startTime==null||!endDate||endTime==null)return null;const a=new Date(startDate);a.setHours(startTime);const b=new Date(endDate);b.setHours(endTime);return Math.max(1,Math.ceil((b-a)/86400000))}
function rate(){const d=rentalDays();return d<=3?selectedCar.rates[0]:d<=6?selectedCar.rates[1]:selectedCar.rates[2]}
function renderCalSummary(){const d=rentalDays();if(!d)return;$('calSummary').innerHTML=`<div class="summary"><div class="dateConfirm"><b>${fmtDate(startDate)} ${String(startTime).padStart(2,'0')}:00</b><span class="arrow">→</span><b>${fmtDate(endDate)} ${String(endTime).padStart(2,'0')}:00</b></div><div class="big">${d} ${d===1?'сутки':d<5?'суток':'суток'} · ${money(d*rate())}</div>${endTime>startTime&&fmtDate(startDate)!==fmtDate(endDate)?'<div class="hint">⚠️ Возврат позже времени получения — оплачивается дополнительное сутки.</div>':''}<button class="primary" style="margin-top:12px" onclick="goForm()">Продолжить →</button></div>`}
function goForm(){if(!rentalDays()){toast('Выберите дату и время возврата');return}show('form');renderForm()}
function renderForm(){$('form').innerHTML=`<button class="back" onclick="startBooking()">← Изменить период</button><div class="sectionTitle">Проверьте заявку</div><div class="sub">Остался последний шаг — проверьте данные и отправьте заявку менеджеру.</div><div class="formStepper"><div class="stepPill">✓ Автомобиль</div><div class="stepPill">✓ Даты</div><div class="stepPill active">3 · Контакты</div></div><div class="confirmCard"><div class="confirmCar">${escapeHtml(selectedCar.name)}</div><div class="confirmRow"><span>Получение</span><b>${fmtDate(startDate)} · ${String(startTime).padStart(2,'0')}:00</b></div><div class="confirmRow"><span>Возврат</span><b>${fmtDate(endDate)} · ${String(endTime).padStart(2,'0')}:00</b></div><div class="confirmRow"><span>Срок аренды</span><b>${rentalDays()} суток</b></div><div class="confirmTotal"><span>Итого</span><b>${money(rentalDays()*rate())}</b></div></div><div class="field"><label>Ваше имя</label><input id="name" placeholder="Имя"></div><div class="field"><label>Телефон</label><input id="phone" type="tel" placeholder="+7 ..."></div><div class="field"><label>Дополнительные пожелания</label><textarea id="comment" placeholder="Детское кресло, место встречи и т.п. (необязательно)"></textarea></div><button class="primary" onclick="submitBooking()">✓ Отправить заявку менеджеру</button><div class="sub" style="text-align:center;margin-top:9px">После отправки менеджер свяжется с вами для подтверждения.</div>`}
async function submitBooking(){const name=$('name').value.trim(),phone=$('phone').value.trim(),comment=$('comment').value.trim();if(!name||phone.length<7){toast('Введите имя и корректный телефон');return}const a=localIso(startDate,startTime),b=localIso(endDate,endTime);try{const r=await api('/api/bookings',{method:'POST',body:JSON.stringify({car_id:selectedCar.id,start_at:a,end_at:b,name,phone,comment})});$('done').innerHTML=`<div class="confirmCard"><div class="confirmHeader"><div><div class="eyebrow">ЗАЯВКА ОТПРАВЛЕНА</div><div style="font-size:24px;font-weight:900;margin-top:5px">Спасибо, ${escapeHtml(name)}!</div></div><div class="confirmNumber">№${r.id}</div></div><div class="sub" style="margin-top:7px">Заявка передана менеджеру BALTICAR.</div><div class="confirmCar">${escapeHtml(selectedCar.name)}</div><div class="confirmRow"><span>Получение</span><b>${fmtDate(startDate)} · ${String(startTime).padStart(2,'0')}:00</b></div><div class="confirmRow"><span>Возврат</span><b>${fmtDate(endDate)} · ${String(endTime).padStart(2,'0')}:00</b></div><div class="confirmRow"><span>Срок аренды</span><b>${r.days} суток</b></div><div class="confirmTotal"><span>Стоимость</span><b>${money(r.total)}</b></div><div class="nextBox"><b>Что дальше?</b><div>Менеджер проверит заявку и свяжется с вами для подтверждения. Выдача и возврат автомобиля — 08:00–20:00. Точная точка встречи согласовывается после подтверждения.</div></div></div><button class="primary" style="margin-top:12px" onclick="openBookings()">📋 Открыть мои брони</button><button class="secondary" style="margin-top:10px" onclick="goHome()">⌂ Главное меню</button>`;show('done');tg?.HapticFeedback?.notificationOccurred('success')}catch(e){toast(e.message)}}
async function openBookings(){show('bookings');$('bookings').innerHTML='<div class="sectionTitle">Мои брони</div><div class="sub">Все ваши заявки в одном месте.</div><div id="blist">Загрузка…</div>';try{const d=await api('/api/mybookings');if(!d.bookings.length){$('blist').innerHTML='<div class="empty">Пока нет бронирований.<br><button class="primary" style="margin-top:16px" onclick="openCars()">Выбрать автомобиль</button></div>';return}$('blist').innerHTML=d.bookings.map(b=>`<div class="bookingCard"><div style="display:flex;justify-content:space-between;gap:10px"><b>№${b.id} · ${b.car_name}</b><span class="status">${status(b.status)}</span></div><div class="sub" style="margin-top:10px">${b.start_at} → ${b.end_at}</div><div style="font-size:21px;font-weight:900;margin-top:8px">${money(b.total)}</div>${['pending','confirmed'].includes(b.status)?`<button class="secondary" style="margin-top:12px" onclick="cancelBooking(${b.id})">Отменить бронь</button>`:''}</div>`).join('')}catch(e){$('blist').innerHTML='<div class="empty">'+e.message+'</div>'}}
function status(s){return ({pending:'🟡 Ожидает',confirmed:'🟢 Подтверждена',cancelled:'⚫ Отменена',rejected:'🔴 Отклонена',expired:'⚪ Истекла'})[s]||s}
async function cancelBooking(id){if(!confirm('Отменить бронирование №'+id+'?'))return;try{await api('/api/bookings/cancel',{method:'POST',body:JSON.stringify({id})});toast('Бронирование отменено');openBookings()}catch(e){toast(e.message)}}
async function openReviews(){show('reviews');$('reviews').innerHTML='<div class="sectionTitle">Отзывы клиентов</div><div class="sub">Реальные впечатления о BALTICAR.</div><div id="rlist">Загрузка…</div>';try{const d=await api('/api/reviews');$('rlist').innerHTML=d.reviews.length?d.reviews.map(r=>`<div class="bookingCard"><div style="font-size:20px">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><div style="margin-top:8px">${escapeHtml(r.text)||'Без текста'}</div><div class="sub" style="margin-top:8px">${escapeHtml(r.name)} · ${escapeHtml(r.car_name)} · ${r.created_at}</div></div>`).join(''):'<div class="empty">Пока нет отзывов.</div>'}catch(e){$('rlist').innerHTML='<div class="empty">'+e.message+'</div>'}}
function openWhy(){show('why');$('why').innerHTML='<div class="sectionTitle">Почему BALTICAR</div><div class="sub">Сервис, который хочется рекомендовать.</div>'+[['🛡','Проверенные автомобили','Следим за состоянием, чистотой и обслуживанием.'],['💰','Прозрачные тарифы','Цена зависит от срока и видна до отправки заявки.'],['⚡','Быстрое подтверждение','Менеджер получает заявку сразу после отправки.'],['📅','Удобное бронирование','Весь путь от автомобиля до заявки — в одном окне.'],['🔔','Напоминания','Бот напомнит о предстоящей аренде заранее.']].map(x=>`<div class="block"><div style="font-size:25px">${x[0]}</div><h3>${x[1]}</h3><div class="sub">${x[2]}</div></div>`).join('')}
function openTerms(){show('terms');$('terms').innerHTML='<div class="sectionTitle">Условия аренды</div><div class="block"><h3>🕐 Время</h3><div class="sub">Выдача и возврат: 08:00–20:00.</div></div><div class="block"><h3>🔧 Технический интервал</h3><div class="sub">Между бронированиями закладывается 2 часа.</div></div><div class="block"><h3>💰 Оплата</h3><div class="sub">Тариф определяется количеством оплачиваемых суток: 1–3, 4–6 или 7+.</div></div><div class="block"><h3>📌 Важно</h3><div class="sub">Если возврат происходит позже полного количества суток, добавляется ещё одни оплачиваемые сутки.</div></div>'}
function openContact(){tg?.openTelegramLink?.('https://t.me/Balticar_kgd')||toast('Откройте канал BALTICAR для связи')}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
renderHome();$('backBtn').style.visibility='hidden';
</script>
