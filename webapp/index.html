.calendar{background:#0b1b29;border:1px solid var(--line);border-radius:22px;padding:13px}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calhead button{background:rgba(255,255,255,.06);width:40px;height:40px;border-radius:12px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;color:var(--muted);font-size:11px;padding:5px 0}.day{min-height:42px;border-radius:12px;background:rgba(255,255,255,.035);display:flex;align-items:center;justify-content:center;border:1px solid transparent;font-size:13px}.day.free{background:#0e2435}.day.busy{color:#66798b;background:#101a22}.day.selected{background:var(--blue);font-weight:800}.day.disabled{opacity:.25}.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.time{padding:12px 4px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:13px}.time.selected{background:var(--blue);font-weight:800}.summary{margin-top:14px;padding:17px;border-radius:20px;background:linear-gradient(145deg,#102b40,#0b1b29);border:1px solid rgba(62,159,255,.25)}.summary .big{font-size:28px;font-weight:900;margin-top:4px}.hint{color:var(--amber);font-size:12px;line-height:1.4;margin-top:7px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#091824;color:#fff;border-radius:14px;padding:13px;font:inherit;outline:none}.field textarea{min-height:88px;resize:vertical}.bookingCard{padding:17px;border-radius:20px;background:linear-gradient(145deg,#102638,#0a1926);border:1px solid var(--line);margin:12px 0}.status{display:inline-flex;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.07);font-size:11px}.ok{color:#74f0aa}.warn{color:#ffd278}.danger{color:#ff8d98}.toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;padding:13px 15px;border-radius:16px;background:#122637;border:1px solid var(--line);box-shadow:0 16px 40px #0008;display:none}.toast.show{display:block;animation:in .2s ease}.empty{text-align:center;padding:40px 20px;color:var(--muted)}
/* V7 UX */
.carBadge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:rgba(43,213,118,.10);color:#1d9a55;font-size:11px;font-weight:800;margin-bottom:8px}.carSpecGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.carSpec{padding:11px;border-radius:15px;background:rgba(20,40,60,.05);border:1px solid #dfe5eb}.carSpec span{display:block;font-size:11px;color:#687585}.carSpec b{display:block;font-size:13px;margin-top:4px}.priceBox{padding:14px;border-radius:18px;background:linear-gradient(135deg,rgba(22,131,255,.08),rgba(43,213,118,.08));border:1px solid rgba(22,131,255,.18);margin:12px 0}.priceBox .price{font-size:25px;font-weight:900}.priceBox .small{font-size:12px;color:#687585;margin-top:3px}.priceBreak{display:grid;gap:7px;margin-top:10px;font-size:13px}.priceRow{display:flex;justify-content:space-between;gap:10px}.locationCard{padding:16px;border-radius:20px;background:linear-gradient(135deg,rgba(22,131,255,.08),rgba(255,255,255,.35));border:1px solid #dfe5eb;margin:12px 0}.locationTitle{font-size:17px;font-weight:800}.locationText{font-size:13px;color:#536170;line-height:1.5;margin:7px 0 12px}.ratingHero{display:flex;align-items:center;gap:15px;padding:18px;border-radius:22px;background:linear-gradient(135deg,rgba(255,182,43,.13),rgba(22,131,255,.08));border:1px solid rgba(255,182,43,.24);margin:14px 0}.ratingBig{font-size:36px;font-weight:900;line-height:1}.stars{color:#f2a900;letter-spacing:1px}.reviewForm{padding:16px;border-radius:20px;background:#fff;border:1px solid #dfe5eb;margin:12px 0}.ratingButtons{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}.ratingBtn{padding:10px 4px;border-radius:12px;background:#f1f4f7;border:1px solid #dfe5eb;color:#536170}.ratingBtn.selected{background:#fff3cf;border-color:#f2c14e;color:#a36a00}.bookingMeta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.metaBox{padding:10px;border-radius:14px;background:rgba(20,40,60,.045);border:1px solid #dfe5eb}.metaBox span{display:block;font-size:10px;color:#687585}.metaBox b{display:block;margin-top:4px;font-size:13px}.detailActions{display:grid;gap:9px;margin-top:12px}

<body>
<div id="app">
<header class="top"><button class="topbtn" id="backBtn" onclick="goBack()">‹</button><div class="brand">BALTICAR</div><button class="topbtn" onclick="goHome()">⌂</button></header>
<section id="home" class="screen active"></section>
<section id="cars" class="screen"></section>
<section id="car" class="screen"></section>
<section id="calendar" class="screen"></section>
<section id="form" class="screen"></section>
<section id="done" class="screen"></section>
<section id="bookings" class="screen"></section>
<section id="reviews" class="screen"></section>
<section id="why" class="screen"></section>
<section id="terms" class="screen"></section>
<div class="toast" id="toast"></div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg=window.Telegram?.WebApp; try{tg?.ready();tg?.expand()}catch(e){}
const $=id=>document.getElementById(id); let current='home', history=[]; let cars=[],selectedCar=null,startDate=null,startTime=null,endDate=null,endTime=null,month=new Date();
const LOCATION_MAP_URL='https://yandex.ru/maps/?text=Калининград';
const headers=()=>({'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''});
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{} if(!r.ok)throw new Error(d.message||'Ошибка сервера');return d}
function money(n){return new Intl.NumberFormat('ru-RU').format(n)+' ₽'}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}
function show(id,push=true){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(push&&current!==id)history.push(current);current=id;window.scrollTo({top:0,behavior:'smooth'});$('backBtn').style.visibility=id==='home'?'hidden':'visible'}
function goBack(){const x=history.pop()||'home';show(x,false)} function goHome(){history=[];show('home',false);renderHome()}
function img(path){return path ? '/' + path.replace(/^\/+/, '') : '/photos/balticar_hero.jpg'}
function renderHome(){ $('home').innerHTML=`<div class="hero"><img src="/photos/balticar_hero.jpg"><div class="heroShade"></div><div class="heroCopy"><div class="eyebrow">BALTICAR • RENT A CAR</div><h1>Аренда автомобилей</h1><p>Калининград и область</p></div></div><div class="sectionTitle">Выберите автомобиль</div><div class="sub">Чистые автомобили, прозрачные тарифы и онлайн-бронирование без лишних звонков.</div><div class="grid" style="margin-top:14px"><button class="navcard" onclick="openCars()"><span class="ico">🚗</span><strong>Автомобили</strong><small>Каталог и цены</small></button><button class="navcard" onclick="openBookings()"><span class="ico">📋</span><strong>Мои брони</strong><small>Статус и детали</small></button><button class="navcard" onclick="openReviews()"><span class="ico">⭐</span><strong>Отзывы</strong><small>Рейтинг и отзывы</small></button><button class="navcard" onclick="openWhy()"><span class="ico">✨</span><strong>Почему BALTICAR</strong><small>Наши преимущества</small></button></div><div class="locationCard"><div class="locationTitle">📍 Получение и возврат</div><div class="locationText">Выдача и возврат автомобиля: <b>08:00–20:00</b>.<br>Точная точка встречи согласовывается менеджером после подтверждения бронирования.</div><div class="row"><button class="secondary" onclick="openMap()">🗺 Открыть карту</button><button class="secondary" onclick="openContact()">💬 Связаться</button></div></div><div class="row" style="margin-top:12px"><button class="secondary" onclick="openTerms()">ℹ️ Условия</button><button class="secondary" onclick="openContact()">📞 Менеджер</button></div>`}
function openMap(){if(tg?.openLink)tg.openLink(LOCATION_MAP_URL);else window.open(LOCATION_MAP_URL,'_blank')}

async function openCars(){show('cars');$('cars').innerHTML='<div class="sectionTitle">Автомобили</div><div class="sub">Выберите автомобиль — далее покажем свободные даты и точную стоимость.</div><div id="carlist">Загрузка…</div>';try{cars=(await api('/api/cars')).cars;renderCars()}catch(e){$('carlist').innerHTML='<div class="empty">Не удалось загрузить автомобили.<br>'+e.message+'</div>'}}
function renderCars(){ $('carlist').innerHTML=cars.map(c=>`<article class="car"><img src="${img(c.photos[0])}"><div class="carbody"><div class="carBadge">● Онлайн-бронирование</div><div class="carline"><div class="carname">${escapeHtml(c.name)}</div><div class="from">от<b>${money(c.rates[2])}</b><span>в сутки</span></div></div><div class="sub" style="margin-top:5px">${escapeHtml(c.description||'Подготовленный автомобиль для комфортных поездок.')}</div><div class="carSpecGrid"><div class="carSpec"><span>Коробка</span><b>${escapeHtml(c.gear)}</b></div><div class="carSpec"><span>Топливо</span><b>${escapeHtml(c.fuel)}</b></div><div class="carSpec"><span>Мест</span><b>${c.seats}</b></div></div><div class="priceBox"><div class="small">Самый выгодный тариф</div><div class="price">${money(c.rates[2])} <span style="font-size:12px;font-weight:600">/ сутки</span></div><div class="small">при аренде от 7 суток</div></div><button class="primary" onclick="openCar('${c.id}')">Подробнее и забронировать →</button></div></article>`).join('')}

function openCar(id){selectedCar=cars.find(x=>x.id===id);show('car');renderCar()}
function renderCar(){const c=selectedCar;$('car').innerHTML=`<button class="back" onclick="openCars()">← К автомобилям</button><img class="detailImg" src="${img(c.photos[0])}"><h1 class="detailTitle">${escapeHtml(c.name)}</h1><div class="sub">${escapeHtml(c.description||'')}</div><div class="facts"><div class="fact">Коробка<b>${escapeHtml(c.gear)}</b></div><div class="fact">Топливо<b>${escapeHtml(c.fuel)}</b></div><div class="fact">Мест<b>${c.seats}</b></div></div><div class="block"><h3>✨ В стоимость входит</h3><div class="sub">✓ Подготовленный автомобиль<br>✓ Понятная стоимость без скрытых доплат<br>✓ Техническое обслуживание<br>✓ Поддержка менеджера</div></div><div class="block"><h3>💰 Тарифы</h3><div class="tariffs"><div class="tariff"><span>1–3 суток</span><b>${money(c.rates[0])}</b></div><div class="tariff"><span>4–6 суток</span><b>${money(c.rates[1])}</b></div><div class="tariff"><span>7+ суток</span><b>${money(c.rates[2])}</b></div></div></div><div class="locationCard"><div class="locationTitle">📍 Получение и возврат</div><div class="locationText">08:00–20:00. Точная точка встречи согласовывается менеджером после подтверждения бронирования.</div><button class="secondary" onclick="openMap()">🗺 Открыть карту Калининграда</button></div><button class="primary" onclick="startBooking()">📅 Забронировать</button><div class="row" style="margin-top:10px"><button class="secondary" onclick="openBookings()">📋 Мои брони</button><button class="secondary" onclick="openContact()">💬 Менеджер</button></div>`}

function startBooking(){startDate=startTime=endDate=endTime=null;month=new Date();show('calendar');renderCalendar('start')}
async function getSlots(mode){
  let url=`/api/slots?car_id=${encodeURIComponent(selectedCar.id)}&year=${month.getFullYear()}&month=${month.getMonth()+1}`;
  if(mode==='end'&&startDate&&startTime!=null) url+=`&start_at=${encodeURIComponent(localIso(startDate,startTime))}`;
  return api(url);
}
function fmtDate(d){return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})}
function localIso(d,h){const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(h)}:00`}
let currentSlots={mode:'start',slots:{}};
function dateKey(d){const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}
function availableHours(d){return currentSlots.slots?.[dateKey(d)]||[]}
function hasHour(d,h){return availableHours(d).includes(h)}
async function renderCalendar(mode){
  $('calendar').innerHTML=`
    <div class="sectionTitle">${mode==='start'?'Дата и время получения':'Дата и время возврата'}</div>
    <div class="sub">${mode==='start'?'Выберите дату и время получения автомобиля.':'Выберите дату и время возврата автомобиля.'}</div>
    <div class="calendar" style="margin-top:14px">
      <div class="calhead">
        <button onclick="shiftMonth(-1,'${mode}')">‹</button>
        <b>${month.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b>
        <button onclick="shiftMonth(1,'${mode}')">›</button>
      </div>
      <div class="week">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div>${x}</div>`).join('')}</div>
      <div id="days" class="days"></div>
      <div id="times"></div>
    </div>
    <div id="calSummary"></div>`;
  try{
    currentSlots=await getSlots(mode);
    drawDays(mode);
  }catch(e){toast(e.message)}
}
async function shiftMonth(delta,mode){month.setMonth(month.getMonth()+delta);await renderCalendar(mode)}
function drawDays(mode){
  const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),today=new Date();
  today.setHours(0,0,0,0);
  let html='';
  const offset=first.getDay()===0?6:first.getDay()-1;
  for(let i=0;i<offset;i++)html+='<div></div>';
  for(let n=1;n<=last.getDate();n++){
    const d=new Date(y,m,n),hasTime=availableHours(d).length>0;
    const dis=d<today || (mode==='end'&&startDate&&d<=startDate) || !hasTime;
    const sel=(mode==='start'&&startDate&&d.toDateString()===startDate.toDateString())||(mode==='end'&&endDate&&d.toDateString()===endDate.toDateString());
    html+=`<button class="day ${hasTime?'free':'busy'} ${dis?'disabled':''} ${sel?'selected':''}" ${dis?'disabled':''} onclick="chooseDay(${n},'${mode}')">${n}</button>`;
  }
  $('days').innerHTML=html;
  if(mode==='start'&&startDate)drawTimes('start');
  if(mode==='end'&&endDate)drawTimes('end');
}
function chooseDay(n,mode){
  const d=new Date(month.getFullYear(),month.getMonth(),n);
  if(mode==='end'&&startDate&&d<=startDate)return;
  if(!availableHours(d).length)return;
  if(mode==='start'){startDate=d;startTime=null;endDate=null;endTime=null}else{endDate=d;endTime=null}
  drawTimes(mode);
}
function drawTimes(mode){
  const box=$('times'),d=mode==='start'?startDate:endDate;
  if(!d){box.innerHTML='';return}
  let html='<div class="sub" style="margin:14px 0 8px">'+fmtDate(d)+'</div><div class="times">';
  for(let h=8;h<=20;h++){
    const ok=hasHour(d,h),selected=(mode==='start'?startTime:endTime)===h;
    html+=`<button class="time ${ok?'available':'unavailable'} ${selected?'selected':''}" ${ok?'':'disabled'} onclick="chooseTime(${h},'${mode}')">${String(h).padStart(2,'0')}:00</button>`;
  }
  html+='</div><div class="sub" style="margin-top:9px;font-size:12px">Светлые — доступно &nbsp; • &nbsp; Затемнённые — занято</div>';
  box.innerHTML=html;
  renderCalSummary();
}
async function chooseTime(h,mode){
  const d=mode==='start'?startDate:endDate;
  if(!d||!hasHour(d,h)){toast('Это время недоступно для выбранного периода');return}
  if(mode==='start'){
    startTime=h;
    endDate=new Date(startDate);endDate.setDate(endDate.getDate()+1);endTime=h;
    month=new Date(endDate.getFullYear(),endDate.getMonth(),1);
    await renderCalendar('end');
  }else{
    endTime=h;
    drawTimes('end');
  }
}
function rentalDays(){if(!startDate||startTime==null||!endDate||endTime==null)return null;const a=new Date(startDate);a.setHours(startTime);const b=new Date(endDate);b.setHours(endTime);return Math.max(1,Math.ceil((b-a)/86400000))}
function rate(){const d=rentalDays();return d<=3?selectedCar.rates[0]:d<=6?selectedCar.rates[1]:selectedCar.rates[2]}
function rateLabel(d){return d<=3?'1–3 суток':d<=6?'4–6 суток':'7+ суток'}
function priceBreakdown(){const d=rentalDays();if(!d)return null;const daily=rate();return {days:d,daily,total:d*daily,label:rateLabel(d)}}
function renderCalSummary(){const p=priceBreakdown();if(!p)return;$('calSummary').innerHTML=`<div class="summary"><div class="sub">${fmtDate(startDate)} ${String(startTime).padStart(2,'0')}:00 → ${fmtDate(endDate)} ${String(endTime).padStart(2,'0')}:00</div><div class="priceBreak"><div class="priceRow"><span>${p.days} ${p.days===1?'сутки':'суток'} × ${money(p.daily)}</span><b>${money(p.total)}</b></div><div class="priceRow"><span>Тариф</span><span>${p.label}</span></div></div><div class="big">${money(p.total)}</div>${endTime>startTime&&fmtDate(startDate)!==fmtDate(endDate)?'<div class="hint">⚠️ Возврат позже времени получения — оплачивается дополнительные сутки.</div>':''}<button class="primary" style="margin-top:12px" onclick="goForm()">Продолжить →</button></div>`}
function goForm(){if(!rentalDays()){toast('Выберите дату и время возврата');return}show('form');renderForm()}
function renderForm(){const p=priceBreakdown();$('form').innerHTML=`<button class="back" onclick="startBooking()">← Изменить период</button><div class="sectionTitle">Проверьте заявку</div><div class="block"><b>${escapeHtml(selectedCar.name)}</b><div class="sub" style="margin-top:7px">${fmtDate(startDate)} ${String(startTime).padStart(2,'0')}:00 → ${fmtDate(endDate)} ${String(endTime).padStart(2,'0')}:00</div><div class="priceBreak"><div class="priceRow"><span>${p.days} ${p.days===1?'сутки':'суток'} × ${money(p.daily)}</span><b>${money(p.total)}</b></div><div class="priceRow"><span>Применённый тариф</span><span>${p.label}</span></div></div><div class="big" style="margin-top:10px">${money(p.total)}</div></div><div class="locationCard"><div class="locationTitle">📍 Получение и возврат</div><div class="locationText">08:00–20:00.<br>Точная точка встречи согласовывается менеджером после подтверждения.</div><button class="secondary" onclick="openMap()">🗺 Открыть карту</button></div><div class="field"><label>Ваше имя</label><input id="name" placeholder="Имя"></div><div class="field"><label>Телефон</label><input id="phone" type="tel" placeholder="+7 ..."></div><div class="field"><label>Дополнительные пожелания</label><textarea id="comment" placeholder="Детское кресло, место встречи и т.п. (необязательно)"></textarea></div><button class="primary" onclick="submitBooking()">✓ Отправить заявку</button>`}
async function submitBooking(){const name=$('name').value.trim(),phone=$('phone').value.trim(),comment=$('comment').value.trim();if(!name||phone.length<7){toast('Введите имя и корректный телефон');return}const a=localIso(startDate,startTime),b=localIso(endDate,endTime);try{const r=await api('/api/bookings',{method:'POST',body:JSON.stringify({car_id:selectedCar.id,start_at:a,end_at:b,name,phone,comment})});$('done').innerHTML=`<div class="hero" style="padding:24px"><div class="eyebrow">ЗАЯВКА ОТПРАВЛЕНА</div><h1>Спасибо, ${escapeHtml(name)}!</h1><p>Заявка №${r.id} принята менеджером.</p></div><div class="summary"><div class="sub">${escapeHtml(selectedCar.name)}</div><div style="margin-top:8px">${fmtDate(startDate)} ${String(startTime).padStart(2,'0')}:00 → ${fmtDate(endDate)} ${String(endTime).padStart(2,'0')}:00</div><div class="priceBreak"><div class="priceRow"><span>${r.days} ${r.days===1?'сутки':'суток'} × ${money(r.total/r.days)}</span><b>${money(r.total)}</b></div><div class="priceRow"><span>Статус</span><span>🟡 Ожидает подтверждения</span></div></div><div class="sub" style="margin-top:9px">Удержание заявки до ${r.expires}</div></div><div class="locationCard"><div class="locationTitle">📍 Получение и возврат</div><div class="locationText">Точная точка встречи будет согласована менеджером.</div><button class="secondary" onclick="openContact()">💬 Связаться с менеджером</button></div><button class="primary" style="margin-top:12px" onclick="openBookings()">📋 Мои брони</button><button class="secondary" style="margin-top:10px" onclick="goHome()">⌂ Главное меню</button>`;show('done');tg?.HapticFeedback?.notificationOccurred('success')}catch(e){toast(e.message)}}
async function openBookings(){show('bookings');$('bookings').innerHTML='<div class="sectionTitle">Личный кабинет</div><div class="sub">Все ваши бронирования, статусы и детали — в одном месте.</div><div id="blist">Загрузка…</div>';try{const d=await api('/api/mybookings');if(!d.bookings.length){$('blist').innerHTML='<div class="empty">Пока нет бронирований.<br><button class="primary" style="margin-top:16px" onclick="openCars()">Выбрать автомобиль</button></div>';return}$('blist').innerHTML=d.bookings.map(b=>{const canReview=b.status==='confirmed'&&b.past&&!b.reviewed;return `<div class="bookingCard"><div style="display:flex;justify-content:space-between;gap:10px"><b>№${b.id}</b><span class="status">${status(b.status)}</span></div><div style="font-size:18px;font-weight:800;margin-top:8px">${escapeHtml(b.car_name)}</div><div class="bookingMeta"><div class="metaBox"><span>Получение</span><b>${b.start_at}</b></div><div class="metaBox"><span>Возврат</span><b>${b.end_at}</b></div></div><div class="priceBreak" style="margin-top:12px"><div class="priceRow"><span>Стоимость аренды</span><b>${money(b.total)}</b></div><div class="priceRow"><span>Место</span><span>Калининград</span></div></div>${b.comment?`<div class="sub" style="margin-top:10px">📝 ${escapeHtml(b.comment)}</div>`:''}<div class="detailActions">${canReview?`<button class="primary" onclick="openReviewForm(${b.id})">⭐ Оставить отзыв</button>`:''}${['pending','confirmed'].includes(b.status)?`<button class="secondary" onclick="cancelBooking(${b.id})">Отменить бронь</button>`:''}<button class="secondary" onclick="openMap()">🗺 Карта получения</button></div></div>`}).join('')}catch(e){$('blist').innerHTML='<div class="empty">'+escapeHtml(e.message)+'</div>'}}
function status(s){return ({pending:'🟡 Ожидает',confirmed:'🟢 Подтверждена',cancelled:'⚫ Отменена',rejected:'🔴 Отклонена',expired:'⚪ Истекла'})[s]||s}
async function cancelBooking(id){if(!confirm('Отменить бронирование №'+id+'?'))return;try{await api('/api/bookings/cancel',{method:'POST',body:JSON.stringify({id})});toast('Бронирование отменено');openBookings()}catch(e){toast(e.message)}}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}
function ratingSummary(list){if(!list.length)return {avg:0,count:0};const avg=list.reduce((s,r)=>s+Number(r.rating||0),0)/list.length;return {avg:Math.round(avg*10)/10,count:list.length}}
async function openReviews(){show('reviews');$('reviews').innerHTML='<div class="sectionTitle">Отзывы клиентов</div><div class="sub">Реальные впечатления о BALTICAR.</div><div id="rlist">Загрузка…</div>';try{const d=await api('/api/reviews');const rs=ratingSummary(d.reviews);const hero=rs.count?`<div class="ratingHero"><div class="ratingBig">${rs.avg.toFixed(1)}</div><div><div class="stars" style="font-size:23px">${stars(Math.round(rs.avg))}</div><div class="sub">Средняя оценка · ${rs.count} ${rs.count===1?'отзыв':rs.count<5?'отзыва':'отзывов'}</div></div></div>`:'<div class="ratingHero"><div class="ratingBig">—</div><div><div style="font-weight:800">Пока нет оценок</div><div class="sub">Ваш отзыв может стать первым.</div></div></div>';$('rlist').innerHTML=hero+(d.reviews.length?d.reviews.map(r=>`<div class="bookingCard"><div class="stars" style="font-size:20px">${stars(Number(r.rating))}</div><div style="margin-top:8px">${escapeHtml(r.text)||'Без текста'}</div><div class="sub" style="margin-top:8px">${escapeHtml(r.name)} · ${escapeHtml(r.car_name)} · ${r.created_at}</div></div>`).join(''):'<div class="empty">Пока нет опубликованных отзывов.</div>')}catch(e){$('rlist').innerHTML='<div class="empty">'+escapeHtml(e.message)+'</div>'}}
let reviewRating=5;
async function openReviewForm(bid){show("reviews");$("reviews").innerHTML=`<button class="back" onclick="openBookings()">← В личный кабинет</button><div class="sectionTitle">Ваш отзыв</div><div class="sub">Оцените аренду — это помогает другим клиентам.</div><div class="reviewForm"><div style="font-weight:800">Оценка</div><div class="ratingButtons">${[1,2,3,4,5].map(n=>'<button class="ratingBtn '+(n===5?'selected':'')+'" id="rate'+n+'" onclick="selectReviewRating('+n+')">'+n+' ★</button>').join('')}</div><div class="field"><label>Комментарий</label><textarea id="reviewText" placeholder="Что понравилось? Как прошла аренда?"></textarea></div><button class="primary" onclick="submitReview(${bid})">Опубликовать отзыв</button></div>`}
function selectReviewRating(n){reviewRating=n;[1,2,3,4,5].forEach(x=>$("rate"+x)?.classList.toggle('selected',x===n))}
async function submitReview(bid){const text=$('reviewText').value.trim();try{await api('/api/reviews',{method:'POST',body:JSON.stringify({booking_id:bid,rating:reviewRating,text})});toast('Спасибо за отзыв!');openReviews()}catch(e){toast(e.message)}}

function openWhy(){show('why');$('why').innerHTML='<div class="sectionTitle">Почему BALTICAR</div><div class="sub">Сервис, который хочется рекомендовать.</div>'+[['🛡','Проверенные автомобили','Следим за состоянием, чистотой и обслуживанием.'],['💰','Прозрачные тарифы','Цена зависит от срока и видна до отправки заявки.'],['⚡','Быстрое подтверждение','Менеджер получает заявку сразу после отправки.'],['📅','Удобное бронирование','Весь путь от автомобиля до заявки — в одном окне.'],['🔔','Напоминания','Бот напомнит о предстоящей аренде заранее.']].map(x=>`<div class="block"><div style="font-size:25px">${x[0]}</div><h3>${x[1]}</h3><div class="sub">${x[2]}</div></div>`).join('')}
function openTerms(){show('terms');$('terms').innerHTML='<div class="sectionTitle">Условия аренды</div><div class="block"><h3>👤 Требования к водителю</h3><div class="sub">Возраст от 23 лет.<br>Стаж вождения от 3 лет.</div></div><div class="block"><h3>🕐 Время</h3><div class="sub">Выдача и возврат: 08:00–20:00.</div></div><div class="block"><h3>🔧 Технический интервал</h3><div class="sub">Между бронированиями закладывается 2 часа.</div></div><div class="block"><h3>💰 Оплата</h3><div class="sub">Тариф определяется количеством оплачиваемых суток: 1–3, 4–6 или 7+.<br>Форма оплаты — любая.</div></div><div class="block"><h3>🏢 Для юридических лиц</h3><div class="sub">Работаем с юридическими лицами.</div></div><div class="block"><h3>📌 Важно</h3><div class="sub">Если возврат происходит позже полного количества суток, добавляется ещё одни оплачиваемые сутки.</div></div>'}
function openContact(){tg?.openTelegramLink?.('https://t.me/Balticar_kgd')||toast('Откройте канал BALTICAR для связи')}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function applySystemTheme(){
  const dark=(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.colorScheme)?Telegram.WebApp.colorScheme==='dark':window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark',!!dark);
  const meta=document.getElementById('themeColorMeta');
  if(meta) meta.setAttribute('content',dark?'#06101a':'#f5f7fa');
  try{tg?.setHeaderColor?.(dark?'#06101a':'#f5f7fa');tg?.setBackgroundColor?.(dark?'#06101a':'#f5f7fa')}catch(e){}
}
