<style>

<script>
window.BALTICAR_applyTheme=function(){
  const scheme=window.Telegram?.WebApp?.colorScheme || (window.matchMedia?.('(prefers-color-scheme: light)').matches?'light':'dark');
  document.documentElement.classList.toggle('light',scheme==='light');
  document.documentElement.classList.toggle('dark',scheme!=='light');
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.content=scheme==='light'?'#f5f7fa':'#07111b';
};
try{
  Telegram?.WebApp?.onEvent?.('themeChanged',window.BALTICAR_applyTheme);
  const mq=window.matchMedia?.('(prefers-color-scheme: light)');
  mq?.addEventListener?.('change',window.BALTICAR_applyTheme);
}catch(e){}
window.BALTICAR_applyTheme();
</script>

let pickupLocation='airport'; let pickupLocationNote='';
const headers=()=>({'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''});
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{} if(!r.ok)throw new Error(d.message||'Ошибка сервера');return d}
function money(n){return new Intl.NumberFormat('ru-RU').format(n)+' ₽'}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}
function show(id,push=true){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(push&&current!==id)history.push(current);current=id;window.scrollTo({top:0,behavior:'smooth'});$('backBtn').style.visibility=id==='home'?'hidden':'visible'}
function goBack(){const x=history.pop()||'home';show(x,false)}
function goHome(){history=[];show('home',false);renderHome()}
function img(path){return path ? '/' + path.replace(/^\/+/, '') : '/photos/balticar_hero.jpg'}
function renderHome(){ $('home').innerHTML=`<div class="heroHome"><img src="/photos/balticar_hero.jpg" alt="BALTICAR"><div class="heroHomeCopy"><span class="heroBadge">● BALTICAR · КАЛИНИНГРАД</span><h1>Аренда автомобиля<br>без лишних шагов.</h1><p>Выберите машину, даты и место получения — заявку отправим менеджеру.</p><button class="homeCta" onclick="openCars()">🚗 Выбрать автомобиль</button></div></div><div class="homeIntro"><div class="sectionTitle">Ваше путешествие начинается здесь</div><span class="homeTrust">✓ БЕЗ СКРЫТЫХ ТАРИФОВ</span></div><div class="sub">Свободные даты, тарифы и подача автомобиля — всё в одном окне.</div><div class="homeQuick"><button class="quick" onclick="openBookings()"><span class="quickIcon">📋</span><b>Мои брони</b><span>Статус и детали</span></button><button class="quick" onclick="openReviews()"><span class="quickIcon">⭐</span><b>Отзывы</b><span>Мнение клиентов</span></button><button class="quick" onclick="openWhy()"><span class="quickIcon">✨</span><b>Почему BALTICAR</b><span>Наши преимущества</span></button><button class="quick" onclick="openTerms()"><span class="quickIcon">ℹ️</span><b>Условия</b><span>Важная информация</span></button></div><div class="row" style="margin-top:11px"><button class="secondary" onclick="openContact()">💬 Связаться с менеджером</button></div>`}
async function openCars(){show('cars');$('cars').innerHTML='<div class="sectionTitle">Автомобили</div><div class="sub">Выберите машину — увидите фото, тариф и сможете сразу перейти к датам.</div><div class="catalogLead"><div><b>🚗 Все автомобили доступны онлайн</b><span>Бронирование без звонка</span></div><span>08:00–20:00</span></div><div id="carlist" class="carlistGrid">Загрузка…</div>';try{cars=(await api('/api/cars')).cars;renderCars()}catch(e){$('carlist').innerHTML='<div class="empty">Не удалось загрузить автомобили.<br>'+e.message+'</div>'}}
function galleryHTML(c,detail=false){const photos=(c.photos||[]).filter(Boolean);const id=(detail?'detail-':'card-')+c.id;return `<div class="${detail?'detailGallery':'carGallery'} gallery" data-gallery="${id}" data-index="0" data-photos='${JSON.stringify(photos)}' ontouchstart="galleryTouchStart(event,this)" ontouchend="galleryTouchEnd(event,this)"><img class="galleryImg" src="${img(photos[0])}" alt="${escapeHtml(c.name)}"><button class="galleryBtn prev" type="button" onclick="galleryMove(event,'${id}',-1)">‹</button><button class="galleryBtn next" type="button" onclick="galleryMove(event,'${id}',1)">›</button><div class="galleryCount">1 / ${photos.length}</div><div class="galleryDots">${photos.map((_,i)=>`<button class="galleryDot ${i===0?'active':''}" type="button" onclick="gallerySet(event,'${id}',${i})"></button>`).join('')}</div></div>`}
function galleryData(id){return document.querySelector(`[data-gallery="${id}"]`)}
function galleryRender(g,i){const photos=JSON.parse(g.dataset.photos||'[]');if(!photos.length)return;i=(i+photos.length)%photos.length;g.dataset.index=i;g.querySelector('.galleryImg').src=img(photos[i]);g.querySelector('.galleryCount').textContent=`${i+1} / ${photos.length}`;g.querySelectorAll('.galleryDot').forEach((d,n)=>d.classList.toggle('active',n===i))}
function galleryMove(ev,id,delta){ev.preventDefault();ev.stopPropagation();const g=galleryData(id);if(g)galleryRender(g,Number(g.dataset.index||0)+delta)}
function gallerySet(ev,id,i){ev.preventDefault();ev.stopPropagation();const g=galleryData(id);if(g)galleryRender(g,i)}
function galleryTouchStart(ev,g){g._touchX=ev.changedTouches[0].clientX}
function galleryTouchEnd(ev,g){const x=ev.changedTouches[0].clientX;const dx=x-(g._touchX||x);if(Math.abs(dx)<35)return;galleryRender(g,Number(g.dataset.index||0)+(dx<0?1:-1))}
function renderCars(){ $('carlist').className='carlistGrid'; $('carlist').innerHTML=cars.map(c=>`<article class="car">${galleryHTML(c)}<div class="carbody"><div class="carTop"><div class="carname">${escapeHtml(c.name)}</div><span class="onlineLabel">● ДОСТУПНО ДЛЯ БРОНИРОВАНИЯ</span></div><div class="chips"><span class="chip">⚙️ ${escapeHtml(c.gear)}</span><span class="chip">⛽ ${escapeHtml(c.fuel)}</span><span class="chip">👥 ${c.seats} мест</span></div><div class="carPrice"><span class="label">Лучшая цена · от 7 суток</span><b>${money(c.rates[2])}</b> <small>/ сутки</small></div><div class="carActions"><button class="primary" onclick="openCar('${c.id}')">Выбрать автомобиль</button><button class="secondary" onclick="openCar('${c.id}')">Подробнее</button></div></div></article>`).join('')}
function openCar(id){selectedCar=cars.find(x=>x.id===id);show('car');renderCar()}
function renderCar(){const c=selectedCar;$('car').innerHTML=`<button class="back" onclick="openCars()">← К автомобилям</button>${galleryHTML(c,true)}<h1 class="detailTitle">${escapeHtml(c.name)}</h1><div class="sub">${escapeHtml(c.description||'')}</div><div class="facts"><div class="fact">Цвет<b>Белый</b></div><div class="fact">Коробка<b>${escapeHtml(c.gear)}</b></div><div class="fact">Топливо<b>${escapeHtml(c.fuel)}</b></div></div><div class="block"><h3>✨ В стоимость входит</h3><div class="sub">✓ Подготовленный автомобиль<br>✓ Понятная стоимость без скрытых доплат<br>✓ Техническое обслуживание<br>✓ Поддержка менеджера</div></div><div class="block"><h3>💰 Тарифы</h3><div class="tariffs"><div class="tariff"><span>1–3 суток</span><b>${money(c.rates[0])}</b></div><div class="tariff"><span>4–6 суток</span><b>${money(c.rates[1])}</b></div><div class="tariff"><span>7+ суток</span><b>${money(c.rates[2])}</b></div></div></div><div class="depositBox">🔐 Залог: <b>10 000 ₽</b></div><div class="locationCard"><div class="locationTitle">📍 Место подачи</div><div class="locationText">✈️ Аэропорт Храброво и 🚆 Южный вокзал — <b>БЕСПЛАТНО</b>.<br>Калининград и область — <b>от 1 000 ₽</b>.</div></div><div class="block"><h3>🕐 Выдача и возврат</h3><div class="sub">08:00–20:00<br>Технический интервал между арендами — 2 часа.</div></div><button class="primary" onclick="startBooking()">📅 Забронировать</button><div class="row" style="margin-top:10px"><button class="secondary" onclick="openBookings()">📋 Мои брони</button><button class="secondary" onclick="goHome()">⌂ Главное</button></div>`}
function startBooking(){startDate=startTime=endDate=endTime=null;pickupLocation='airport';pickupLocationNote='';month=new Date();show('calendar');renderCalendar('start')}
async function getAvail(){return api(`/api/availability?car_id=${encodeURIComponent(selectedCar.id)}&year=${month.getFullYear()}&month=${month.getMonth()+1}`)}
function fmtDate(d){return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})}
function localIso(d,h){const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(h)}:00`}
let currentAvail={bookings:[],maintenance:[]};
const BUFFER_MS=2*60*60*1000;
function blocks(){return [...(currentAvail.bookings||[]),...(currentAvail.maintenance||[])]}
function intervalFree(a,b){if(!(a instanceof Date)||!(b instanceof Date)||b<=a)return false;return !blocks().some(x=>{const bs=new Date(x.start_at).getTime()-BUFFER_MS;const be=new Date(x.end_at).getTime()+BUFFER_MS;return a.getTime()<be&&b.getTime()>bs})}
function candidateStartFree(d,h){const a=new Date(d);a.setHours(h,0,0,0);const b=new Date(a);b.setDate(b.getDate()+1);return intervalFree(a,b)}
function candidateEndFree(d,h){if(!startDate||startTime==null)return false;const a=new Date(startDate);a.setHours(startTime,0,0,0);const b=new Date(d);b.setHours(h,0,0,0);return b>a&&intervalFree(a,b)}
function dayHasAvailableTime(d,mode){for(let h=8;h<=20;h++)if(mode==='start'?candidateStartFree(d,h):candidateEndFree(d,h))return true;return false}
async function renderCalendar(mode){$('calendar').innerHTML=`<div class="sectionTitle">${mode==='start'?'Когда забираете?':'Когда возвращаете?'}</div><div class="sub">${mode==='start'?'Сначала выберите удобную дату и время получения автомобиля.':'Выберите дату и время возврата. Доступные варианты подсвечены.'}</div><div class="calendar" style="margin-top:14px"><div class="calhead"><button onclick="shiftMonth(-1,'${mode}')">‹</button><b>${month.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b><button onclick="shiftMonth(1,'${mode}')">›</button></div><div class="week">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div>${x}</div>`).join('')}</div><div id="days" class="days"></div><div id="times"></div><div class="calTip">🕐 Выдача и возврат доступны с 08:00 до 20:00. Между арендами автоматически учитывается технический интервал.</div></div><div id="calSummary"></div>`;try{currentAvail=await getAvail();drawDays(currentAvail,mode)}catch(e){toast(e.message)}}
async function shiftMonth(delta,mode){month.setMonth(month.getMonth()+delta);await renderCalendar(mode)}
function drawDays(av,mode){currentAvail=av||{bookings:[],maintenance:[]};const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),today=new Date();today.setHours(0,0,0,0);let html='';const offset=first.getDay()===0?6:first.getDay()-1;for(let i=0;i<offset;i++)html+='<div></div>';for(let n=1;n<=last.getDate();n++){const d=new Date(y,m,n),hasTime=dayHasAvailableTime(d,mode),dis=d<today||(mode==='end'&&startDate&&d<=startDate)||!hasTime,sel=(mode==='start'&&startDate&&d.toDateString()===startDate.toDateString())||(mode==='end'&&endDate&&d.toDateString()===endDate.toDateString());html+=`<button class="day ${hasTime?'free':'busy'} ${dis?'disabled':''} ${sel?'selected':''}" ${dis?'disabled':''} onclick="chooseDay(${n},'${mode}')">${n}</button>`}$('days').innerHTML=html;if(mode==='start'&&startDate)drawTimes('start');if(mode==='end'&&endDate)drawTimes('end')}
async function chooseDay(n,mode){const d=new Date(month.getFullYear(),month.getMonth(),n);if(mode==='end'&&startDate&&d<=startDate)return;if(!dayHasAvailableTime(d,mode))return;if(mode==='start')startDate=d;else endDate=d;drawTimes(mode)}
function drawTimes(mode){const box=$('times'),d=mode==='start'?startDate:endDate;let html=`<div class="timeTitle"><b>Выберите время</b><span>${fmtDate(d)}</span></div><div class="times">`;for(let h=8;h<=20;h++){const ok=mode==='start'?candidateStartFree(d,h):candidateEndFree(d,h),selected=(mode==='start'?startTime:endTime)===h;html+=`<button class="time ${selected?'selected':''}" ${ok?'':'disabled'} onclick="chooseTime(${h},'${mode}')">${String(h).padStart(2,'0')}:00</button>`}html+='</div>';box.innerHTML=html;renderCalSummary()}
function chooseTime(h,mode){const d=mode==='start'?startDate:endDate,ok=mode==='start'?candidateStartFree(d,h):candidateEndFree(d,h);if(!ok){toast('Это время недоступно для выбранного периода');return}if(mode==='start')startTime=h;else endTime=h;drawTimes(mode);if(mode==='start'&&startDate&&startTime!=null){endDate=new Date(startDate);endDate.setDate(endDate.getDate()+1);endTime=startTime;renderCalendar('end')}else renderCalSummary()}
function rentalDays(){if(!startDate||startTime==null||!endDate||endTime==null)return null;const a=new Date(startDate);a.setHours(startTime);const b=new Date(endDate);b.setHours(endTime);return Math.max(1,Math.ceil((b-a)/86400000))}
function rate(){const d=rentalDays();return d<=3?selectedCar.rates[0]:d<=6?selectedCar.rates[1]:selectedCar.rates[2]}
function renderCalSummary(){const d=rentalDays();if(!d)return;$('calSummary').innerHTML=`<div class="summary"><div class="sub">${fmtDate(startDate)} ${String(startTime).padStart(2,'0')}:00 → ${fmtDate(endDate)} ${String(endTime).padStart(2,'0')}:00</div><div class="big">${d} суток · ${money(d*rate())}</div>${endTime>startTime&&fmtDate(startDate)!==fmtDate(endDate)?'<div class="hint">⚠️ Возврат позже времени получения — оплачивается дополнительное сутки.</div>':''}<button class="primary" style="margin-top:12px" onclick="goForm()">Продолжить →</button></div>`}
function goForm(){if(!rentalDays()){toast('Выберите дату и время возврата');return}show('form');renderForm()}
function selectPickupLocation(v){pickupLocation=v;document.querySelectorAll('.locationOption').forEach(x=>x.classList.toggle('selected',x.dataset.location===v));const req=$('pickupRequest');if(req)req.style.display=v==='other'?'block':'none';const note=$('pickupLocationNote');if(note)pickupLocationNote=note.value.trim();renderLocationCost()}
function renderLocationCost(){const box=$('locationCost');const label=pickupLocation==='airport'?'Аэропорт Храброво':pickupLocation==='station'?'Южный вокзал':pickupLocation==='city'?'Калининград':pickupLocation==='region'?'Калининградская область':'Другое место';const review=$('reviewLocation');if(review)review.textContent=label+(pickupLocationNote?' · '+pickupLocationNote:'');if(!box)return;const fee=pickupLocation==='airport'||pickupLocation==='station'?0:null;box.innerHTML=fee===0?`<div class="priceRow"><span>Подача</span><b>БЕСПЛАТНО</b></div>`:`<div class="priceRow"><span>Подача</span><b>от 1 000 ₽</b></div><div class="sub" style="margin-top:4px">Точная стоимость зависит от адреса и будет подтверждена менеджером.</div>`}
function renderForm(){const days=rentalDays(),rentTotal=days*rate();const label=pickupLocation==='airport'?'Аэропорт Храброво':pickupLocation==='station'?'Южный вокзал':pickupLocation==='city'?'Калининград':pickupLocation==='region'?'Калининградская область':'Другое место';$('form').innerHTML=`<button class="back" onclick="startBooking()">← Изменить даты</button><div class="sectionTitle">Оформление заявки</div><div class="sub">Проверьте детали аренды перед отправкой.</div><div class="reviewCard" style="margin-top:14px"><div class="reviewHead"><img class="reviewThumb" src="${img(selectedCar.photos?.[0])}" alt=""><div><div class="reviewTitle">${escapeHtml(selectedCar.name)}</div><div class="sub" style="margin-top:5px">${days} ${days===1?'сутки':'суток'} · ${money(rate())}/сутки</div></div></div><div class="reviewLine"><span>📅 Период</span><b>${fmtDate(startDate)} ${String(startTime).padStart(2,'0')}:00<br>→ ${fmtDate(endDate)} ${String(endTime).padStart(2,'0')}:00</b></div><div class="reviewLine"><span>📍 Место подачи</span><b id="reviewLocation">${label}</b></div><div class="reviewTotal"><div><small>Стоимость аренды</small><strong>${money(rentTotal)}</strong></div><div class="deposit">Залог<br><b>10 000 ₽</b></div></div></div><div class="locationCard" style="margin-top:14px"><div class="locationTitle">📍 Где получить автомобиль?</div><div class="locationText">Выберите удобную точку. Бесплатная подача доступна в аэропорту и на Южном вокзале.</div><div class="locationPicker"><button type="button" class="locationOption ${pickupLocation==='airport'?'selected':''}" data-location="airport" onclick="selectPickupLocation('airport')"><span class="locIcon">✈️</span><span class="locMain"><b>Аэропорт Храброво</b><span>Самый удобный вариант для прилёта</span></span><span class="locationFree">0 ₽</span></button><button type="button" class="locationOption ${pickupLocation==='station'?'selected':''}" data-location="station" onclick="selectPickupLocation('station')"><span class="locIcon">🚆</span><span class="locMain"><b>Южный вокзал</b><span>Центр города</span></span><span class="locationFree">0 ₽</span></button><button type="button" class="locationOption ${pickupLocation==='city'?'selected':''}" data-location="city" onclick="selectPickupLocation('city')"><span class="locIcon">📍</span><span class="locMain"><b>Калининград</b><span>Подача по адресу</span></span><span>от 1 000 ₽</span></button><button type="button" class="locationOption ${pickupLocation==='region'?'selected':''}" data-location="region" onclick="selectPickupLocation('region')"><span class="locIcon">🗺️</span><span class="locMain"><b>Калининградская область</b><span>Подача по адресу</span></span><span>от 1 000 ₽</span></button><button type="button" class="locationOption ${pickupLocation==='other'?'selected':''}" data-location="other" onclick="selectPickupLocation('other')"><span class="locIcon">📌</span><span class="locMain"><b>Другое место</b><span>Согласуем с менеджером</span></span><span>По запросу</span></button></div><div id="pickupRequest" class="locationRequest" style="display:${pickupLocation==='other'?'block':'none'}"><div class="field"><label>Адрес или описание места</label><input id="pickupLocationNote" placeholder="Например: Светлогорск, ул. Ленина, 10" value="${escapeHtml(pickupLocationNote)}" oninput="pickupLocationNote=this.value"></div></div><div id="locationCost" class="locationCost"></div><div class="locationNotice">После отправки заявки менеджер подтвердит точную стоимость подачи, если она платная.</div></div><div class="block"><h3>👤 Контактные данные</h3><div class="field"><label>Ваше имя</label><input id="name" placeholder="Как к вам обращаться?"></div><div class="field"><label>Телефон</label><input id="phone" type="tel" inputmode="tel" placeholder="+7 ..."></div><div class="field"><label>Пожелания <span style="font-weight:500">· необязательно</span></label><textarea id="comment" placeholder="Детское кресло и другие пожелания"></textarea></div></div><button class="primary" onclick="submitBooking()">✓ Отправить заявку</button>`;renderLocationCost()}
async function submitBooking(){const name=$('name').value.trim(),phone=$('phone').value.trim(),comment=$('comment').value.trim();if(!name||phone.length<7){toast('Введите имя и корректный телефон');return}if(pickupLocation==='other'&&!$('pickupLocationNote').value.trim()){toast('Укажите адрес или описание места подачи');return}pickupLocationNote=$('pickupLocationNote')?.value.trim()||pickupLocationNote;const a=localIso(startDate,startTime),b=localIso(endDate,endTime);const locationLabel=pickupLocation==='airport'?'Аэропорт Храброво':pickupLocation==='station'?'Южный вокзал':pickupLocation==='city'?'Калининград':pickupLocation==='region'?'Калининградская область':'Другое место';try{const r=await api('/api/bookings',{method:'POST',body:JSON.stringify({car_id:selectedCar.id,start_at:a,end_at:b,name,phone,comment,pickup_location:locationLabel,pickup_location_type:pickupLocation,pickup_location_note:pickupLocationNote})});const pickupCost=r.pickup_fee===0?'БЕСПЛАТНО':(r.pickup_fee?money(r.pickup_fee):'от 1 000 ₽ · уточняется');$('done').innerHTML=`<div class="heroHome" style="min-height:auto;padding:24px"><div class="heroHomeCopy" style="position:relative;left:auto;right:auto;bottom:auto"><span class="heroBadge">✓ ЗАЯВКА ОТПРАВЛЕНА</span><h1>Спасибо, ${escapeHtml(name)}!</h1><p>Заявка №${r.id} принята менеджером.</p></div></div><div class="summary"><div class="sub">${escapeHtml(selectedCar.name)}</div><div style="margin-top:8px">${fmtDate(startDate)} ${String(startTime).padStart(2,'0')}:00 → ${fmtDate(endDate)} ${String(endTime).padStart(2,'0')}:00</div><div class="priceBreak"><div class="priceRow"><span>Аренда</span><b>${money(r.total)}</b></div><div class="priceRow"><span>Подача · ${escapeHtml(locationLabel)}</span><b>${pickupCost}</b></div><div class="priceRow"><span>Залог</span><b>10 000 ₽</b></div></div><div class="big" style="margin-top:8px">${r.pickup_fee===0?money(r.total):'Аренда + подача от 1 000 ₽'}</div><div class="sub">${r.days} суток · удержание заявки до ${r.expires}</div></div><button class="primary" style="margin-top:12px" onclick="openBookings()">📋 Мои брони</button><button class="secondary" style="margin-top:10px" onclick="goHome()">⌂ Главное меню</button>`;show('done');tg?.HapticFeedback?.notificationOccurred('success')}catch(e){toast(e.message)}}
async function openBookings(){show('bookings');$('bookings').innerHTML='<div class="sectionTitle">Личный кабинет</div><div class="sub">Все ваши заявки, подтверждённые брони и завершённые аренды — в одном месте.</div><div id="bhero"></div><div id="blist">Загрузка…</div>';try{const d=await api('/api/mybookings');if(!cars.length){try{cars=(await api('/api/cars')).cars||[]}catch(e){}}if(!d.bookings.length){$('blist').innerHTML='<div class="empty">Пока нет бронирований.<br><button class="primary" style="margin-top:16px" onclick="openCars()">Выбрать автомобиль</button></div>';return}const active=d.bookings.filter(b=>['pending','confirmed'].includes(b.status)&&!b.past),next=active.slice().sort((a,b)=>new Date(a.start_at)-new Date(b.start_at))[0];if(next){$('bhero').innerHTML=`<div class="bookingHero"><div class="heroLine"><div class="heroTitle">${next.status==='confirmed'?'🟢 Ближайшая подтверждённая бронь':'🟡 Ближайшая заявка'}</div><span class="status">№${next.id}</span></div><div class="countdown" id="countdown-${next.id}">До получения автомобиля — считаем…<small>${escapeHtml(next.car_name)} · ${escapeHtml(next.start_at)}</small></div></div>`;startCountdown(next.id,next.start_at)}$('blist').innerHTML=d.bookings.map(b=>{const c=cars.find(x=>x.id===b.car_id),canReview=(b.status==='confirmed'||b.status==='completed')&&b.past&&!b.reviewed,completed=(b.status==='completed')||(b.status==='confirmed'&&b.past),shownStatus=completed?'completed':b.status,guide=completed?'✓ Аренда завершена. Спасибо, что выбрали BALTICAR.':b.status==='confirmed'?'✓ Бронь подтверждена. Менеджер согласует точную точку встречи.':b.status==='pending'?'⏳ Заявка ожидает подтверждения. После подтверждения менеджер свяжется с вами.':b.status==='cancelled'?'Бронь отменена.':'Статус заявки обновлён.';return `<div class="bookingCard"><div class="bookingCardTop">${c?`<img class="bookingCarThumb" src="${img(c.photos?.[0])}" alt="">`:''}<div class="bookingCardInfo"><div class="bookingNo">Бронирование №${b.id}</div><b>${escapeHtml(b.car_name)}</b><div style="margin-top:6px"><span class="status ${shownStatus}">${status(shownStatus)}</span></div></div></div><div class="bookingFacts"><div class="bookingFact"><span>Получение</span><b>${escapeHtml(b.start_at)}</b></div><div class="bookingFact"><span>Возврат</span><b>${escapeHtml(b.end_at)}</b></div></div><div class="priceBreak"><div class="priceRow"><span>Стоимость аренды</span><b>${money(b.total)}</b></div><div class="priceRow"><span>Залог</span><b>10 000 ₽</b></div><div class="priceRow"><span>Место подачи</span><span>${escapeHtml(b.pickup_location||'Калининград')}</span></div>${b.pickup_location_fee===0?'<div class="priceRow"><span>Подача</span><b>БЕСПЛАТНО</b></div>':b.pickup_location_fee!=null?`<div class="priceRow"><span>Подача</span><b>от 1 000 ₽</b></div>`:''}</div>${b.comment?`<div class="sub" style="margin-top:10px">📝 ${escapeHtml(b.comment)}</div>`:''}<div class="bookingStatusBox ${shownStatus==='confirmed'?'confirmed':''} ${completed?'completed':''}">${guide}</div><div class="detailActions">${canReview?`<button class="primary" onclick="openReviewForm(${b.id})">⭐ Оставить отзыв</button>`:''}${['pending','confirmed'].includes(b.status)&&!b.past?`<button class="secondary" onclick="cancelBooking(${b.id})">Отменить бронь</button>`:''}<div class="row"><button class="secondary" onclick="openMap()">🗺 Карта</button><button class="secondary" onclick="openContact()">💬 Менеджер</button></div></div></div>`}).join('')}catch(e){$('blist').innerHTML='<div class="empty">'+escapeHtml(e.message)+'</div>'}}
function startCountdown(id,value){const el=$('countdown-'+id);if(!el)return;const tick=()=>{const d=new Date(value),ms=d.getTime()-Date.now();if(!Number.isFinite(ms)){el.firstChild.textContent='Ближайшее получение: '+value;return}if(ms<=0){el.firstChild.textContent='Автомобиль уже должен быть выдан';return}const days=Math.floor(ms/86400000),hrs=Math.floor(ms%86400000/3600000),mins=Math.floor(ms%3600000/60000);el.firstChild.textContent=days?`До получения — ${days} дн. ${hrs} ч.`:`До получения — ${hrs} ч. ${mins} мин.`};tick();setInterval(tick,60000)}
function status(s){return ({pending:'🟡 Ожидает подтверждения',confirmed:'🟢 Подтверждена',completed:'🔵 Завершена',cancelled:'⚫ Отменена',rejected:'🔴 Отклонена',expired:'⚪ Истекла'})[s]||s}
async function cancelBooking(id){if(!confirm('Отменить бронирование №'+id+'?'))return;try{await api('/api/bookings/cancel',{method:'POST',body:JSON.stringify({id})});toast('Бронирование отменено');openBookings()}catch(e){toast(e.message)}}
async function openReviews(){show('reviews');$('reviews').innerHTML='<div class="sectionTitle">Отзывы клиентов</div><div class="sub">Реальные впечатления о BALTICAR.</div><div id="rlist">Загрузка…</div>';try{const d=await api('/api/reviews');$('rlist').innerHTML=d.reviews.length?d.reviews.map(r=>`<div class="bookingCard"><div style="font-size:20px">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><div style="margin-top:8px">${escapeHtml(r.text)||'Без текста'}</div><div class="sub" style="margin-top:8px">${escapeHtml(r.name)} · ${escapeHtml(r.car_name)} · ${r.created_at}</div></div>`).join(''):'<div class="empty">Пока нет отзывов.</div>'}catch(e){$('rlist').innerHTML='<div class="empty">'+e.message+'</div>'}}
function openWhy(){show('why');$('why').innerHTML='<div class="sectionTitle">Почему BALTICAR</div><div class="sub">Сервис, который хочется рекомендовать.</div>'+[['🛡','Проверенные автомобили','Следим за состоянием, чистотой и обслуживанием.'],['💰','Прозрачные тарифы','Цена зависит от срока и видна до отправки заявки.'],['⚡','Быстрое подтверждение','Менеджер получает заявку сразу после отправки.'],['📅','Удобное бронирование','Весь путь от автомобиля до заявки — в одном окне.'],['🔔','Напоминания','Бот напомнит о предстоящей аренде заранее.']].map(x=>`<div class="block"><div style="font-size:25px">${x[0]}</div><h3>${x[1]}</h3><div class="sub">${x[2]}</div></div>`).join('')}
function openTerms(){show('terms');$('terms').innerHTML='<div class="sectionTitle">Условия аренды</div><div class="block"><h3>🕐 Время</h3><div class="sub">Выдача и возврат: 08:00–20:00.</div></div><div class="block"><h3>🔧 Технический интервал</h3><div class="sub">Между бронированиями закладывается 2 часа.</div></div><div class="block"><h3>💰 Оплата</h3><div class="sub">Тариф определяется количеством оплачиваемых суток: 1–3, 4–6 или 7+.</div></div><div class="block"><h3>📌 Важно</h3><div class="sub">Если возврат происходит позже полного количества суток, добавляется ещё одни оплачиваемые сутки.</div></div>'}
function openContact(){tg?.openTelegramLink?.('https://t.me/Balticar_kgd')||toast('Откройте канал BALTICAR для связи')}
function openMap(){tg?.openTelegramLink?.('https://t.me/Balticar_kgd')||toast('Свяжитесь с менеджером для уточнения точки встречи')}
function openReviewForm(id){toast('Форма отзыва будет открыта менеджером')}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
renderHome();$('backBtn').style.visibility='hidden';
</script>
</body>
