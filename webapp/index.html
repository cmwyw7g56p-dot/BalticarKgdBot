<style>
:root{--bg:#f5f8fb;--card:#fff;--navy:#081724;--navy2:#10283a;--text:#132538;--muted:#6f8192;--line:#dce5ed;--blue:#1683ff;--blue2:#0d6de5;--green:#1fa66a;--greenbg:#e6f8ef;--soft:#f2f6fa;--info:#edf7ff;--infoLine:#cce7ff;--shadow:0 8px 24px rgba(20,55,85,.08);--r:18px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}body{min-height:100vh}button,input,textarea{font:inherit}button{border:0;cursor:pointer;color:inherit}#app{max-width:620px;margin:auto;padding:0 12px calc(18px + env(safe-area-inset-bottom))}.screen{display:none}.screen.active{display:block;animation:in .18s ease}@keyframes in{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
.appHead{height:70px;background:var(--navy);color:#fff;border-radius:0 0 18px 18px;padding:12px 16px;display:flex;align-items:center;gap:10px;margin:0 -12px 12px}.headBtn{width:34px;height:34px;border-radius:11px;background:transparent;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center}.headBrand{flex:1}.logo{font-size:19px;font-weight:900;letter-spacing:.04em}.tag{font-size:10px;opacity:.86;margin-top:1px}.headTitle{font-size:16px;font-weight:800}.homeHead{justify-content:flex-start}.homeHead .headBtn{display:none}
.hero{position:relative;overflow:hidden;border-radius:0 0 20px 20px;margin:0 -1px 14px;background:#0b1d2b;min-height:184px}.hero img{width:100%;height:184px;display:block;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,18,29,.8),rgba(4,18,29,.1) 72%),linear-gradient(0deg,rgba(4,18,29,.35),transparent 55%)}.heroCopy{position:absolute;z-index:1;left:18px;top:20px;right:18px;color:#fff;max-width:230px}.heroCopy h1{font-size:25px;line-height:1.05;margin:0 0 10px;font-weight:900}.heroCopy p{font-size:13px;line-height:1.35;margin:0 0 13px}.heroCta{display:inline-flex;padding:10px 13px;border-radius:10px;background:#fff;color:#112537;font-weight:800;font-size:12px}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 8px}.sectionHead h2{margin:0;font-size:18px}.sectionLink{font-size:11px;color:var(--blue);font-weight:800;background:none}.filters{display:flex;gap:7px;margin:0 4px 12px}.filter{padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:999px;color:#668097;font-size:11px}.filter.active{background:var(--navy);border-color:var(--navy);color:#fff}.homeCar{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:10px;margin:0 4px 12px}.homeCar img{width:100%;height:128px;object-fit:contain;display:block}.homeCarName{font-size:14px;font-weight:850}.miniMeta{font-size:11px;color:var(--muted);margin-top:3px}.miniRow{display:flex;gap:10px;color:#53687a;font-size:10px;margin-top:8px}.miniPrice{font-size:14px;font-weight:900;margin-top:10px}.bottomNav{position:sticky;bottom:calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.12);margin:10px 4px 0;z-index:4}.bn{background:none;color:#6c7e8e;font-size:9px;text-align:center;padding:5px 2px}.bn .ico{display:block;font-size:17px;line-height:1.1;margin-bottom:2px}.bn.active{color:var(--blue);font-weight:800}
.catalogTitle{font-size:26px;font-weight:900;margin:8px 4px 4px}.catalogSub{font-size:13px;line-height:1.4;color:var(--muted);margin:0 4px 13px}.catalog{display:grid;grid-template-columns:1fr 1fr;gap:10px}.carCard{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);padding:9px;min-width:0;overflow:hidden}.carGallery{position:relative;border-radius:13px;background:#f7fafc;overflow:hidden}.galleryImg{width:100%;height:116px;display:block;object-fit:contain;background:#fff}.gArrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 9px rgba(0,0,0,.08);font-size:24px;line-height:30px}.gArrow.left{left:5px}.gArrow.right{right:5px}.gCount{position:absolute;right:6px;top:6px;background:#53606c;color:#fff;border-radius:9px;padding:5px 7px;font-size:10px;font-weight:800}.dots{display:flex;justify-content:center;gap:5px;padding:6px 0 2px}.dot{width:7px;height:7px;border-radius:50%;background:#bcc5cc}.dot.active{background:var(--blue)}.carName{font-size:17px;line-height:1.08;font-weight:900;margin:8px 2px 3px;min-height:37px}.online{display:inline-flex;align-items:center;gap:4px;color:var(--green);background:var(--greenbg);border-radius:999px;padding:5px 7px;font-size:9px;font-weight:800;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.online:before{content:"";width:7px;height:7px;background:var(--green);border-radius:50%;flex:0 0 auto}.cardDesc{font-size:11px;line-height:1.35;color:var(--muted);min-height:30px;margin:5px 2px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}.chip{background:#edf2f6;color:#52687a;border-radius:999px;padding:6px 7px;font-size:9px;white-space:nowrap}.best{background:#f3f7fa;border-radius:12px;padding:9px;margin-top:6px}.best small{display:block;color:#7c8d9c;font-size:9px}.best strong{font-size:16px}.best span{font-size:9px;color:#697b8a}.cardBtn{width:100%;margin-top:8px;padding:11px 8px;border-radius:11px;background:var(--blue);color:#fff;font-size:12px;font-weight:900}.catalogNote{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;gap:10px;align-items:flex-start}.catalogNote .nIcon{width:34px;height:34px;border-radius:11px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.catalogNote b{font-size:13px}.catalogNote p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.4}
.detailHero{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}.detailMain{position:relative;background:#071724}.detailMain .galleryImg{height:225px;background:#eef3f6}.detailThumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px}.thumb{height:56px;border-radius:8px;object-fit:contain;background:#fff;border:2px solid transparent}.thumb.active{border-color:var(--blue)}.detailBody{padding:2px 14px 14px}.detailBody h1{font-size:20px;margin:8px 0 3px}.detailMeta{font-size:12px;color:#607587}.detailFacts{display:flex;gap:15px;margin:12px 0;color:#50677a;font-size:11px}.detailFacts span{white-space:nowrap}.line{height:1px;background:var(--line);margin:10px 0}.specTitle{font-size:14px;font-weight:900;margin:9px 0}.specRow{display:flex;justify-content:space-between;padding:7px 0;font-size:11px}.specRow span:first-child{color:var(--muted)}.priceLine{display:flex;align-items:end;justify-content:space-between;margin:14px 0}.priceLine b{font-size:20px}.primary{width:100%;padding:13px 14px;border-radius:12px;background:var(--navy);color:#fff;font-weight:900}.secondary{width:100%;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:800}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pageTitle{font-size:20px;font-weight:900;margin:8px 4px}.pageSub{font-size:12px;color:var(--muted);line-height:1.45;margin:0 4px 12px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;margin:10px 0}.panel h3{font-size:14px;margin:0 0 8px}.calendar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}.calHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.calHead button{width:34px;height:34px;border-radius:10px;background:var(--soft);font-size:20px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;color:#8a9aa8;font-size:9px;padding:4px 0}.day{min-height:38px;border-radius:9px;background:#f4f7f9;border:1px solid transparent;font-size:11px}.day.free{background:#eef8f3}.day.busy{color:#aab4bd;background:#f0f2f4}.day.selected{background:var(--blue);color:#fff;font-weight:900}.day:disabled{opacity:.42}.times{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.time{padding:9px 4px;border-radius:9px;background:#f3f6f8;border:1px solid var(--line);font-size:11px}.time.selected{background:var(--blue);border-color:var(--blue);color:#fff}.time:disabled{opacity:.35}.dateConfirm{background:#f3f8fc;border:1px solid #d7e6f2;border-radius:12px;padding:11px;font-size:12px;font-weight:850;display:flex;align-items:center;justify-content:space-between;gap:6px}.dateConfirm .arrow{color:var(--blue);font-size:18px}.totalBox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow);margin-top:10px}.totalRow{display:flex;justify-content:space-between;padding:6px 0;font-size:12px}.totalRow.total{font-size:16px;font-weight:900;border-top:1px solid var(--line);margin-top:5px;padding-top:10px}.locationItem{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;margin:7px 0;box-shadow:0 4px 14px rgba(20,55,85,.04)}.locIcon{width:36px;height:36px;border-radius:10px;background:#f2f6f9;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}.locMain{flex:1;min-width:0}.locMain b{display:block;font-size:12px}.locMain span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.badge{display:inline-block;background:var(--greenbg);color:var(--green);padding:3px 6px;border-radius:999px;font-size:8px;font-weight:900;margin-left:5px}.radio{width:19px;height:19px;border:2px solid #b7c5d0;border-radius:50%;display:flex;align-items:center;justify-content:center}.radio.on{border-color:var(--blue)}.radio.on:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--blue)}.info{background:var(--info);border:1px solid var(--infoLine);border-radius:12px;padding:10px;color:#3978b4;font-size:10px;line-height:1.4;margin-top:9px}.field{margin:9px 0}.field label{display:block;color:#6e8090;font-size:10px;margin-bottom:5px}.field input,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none;color:var(--text);font-size:12px}.field textarea{min-height:76px;resize:vertical}.orderCard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;box-shadow:var(--shadow)}.orderCar{display:flex;gap:9px;align-items:center}.orderCar img{width:72px;height:48px;object-fit:contain;background:#f6f8fa;border-radius:8px}.orderCar b{font-size:13px}.orderCar span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.orderLine{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:11px}.orderIcon{font-size:18px;width:25px}.muted{color:var(--muted)}.doneIcon{width:62px;height:62px;border-radius:50%;background:#e7f8ef;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:32px;margin:18px auto 8px}.center{text-align:center}.bookingCard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;margin:9px 0;box-shadow:var(--shadow)}.status{padding:4px 7px;border-radius:999px;background:#eef4f8;font-size:9px;font-weight:800}.profile{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;box-shadow:var(--shadow)}.avatar{width:48px;height:48px;border-radius:50%;background:#d9e8f5;display:flex;align-items:center;justify-content:center;font-size:24px}.menuItem{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);font-size:12px}.menuItem:last-child{border-bottom:0}.toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;background:var(--navy);color:#fff;padding:12px 14px;border-radius:12px;display:none;box-shadow:0 14px 30px rgba(0,0,0,.22);font-size:12px}.toast.show{display:block}
@media(max-width:390px){.catalog{gap:8px}.carCard{padding:8px}.galleryImg{height:106px}.carName{font-size:16px}.online{font-size:8px}.chip{font-size:8px;padding:5px 6px}.best strong{font-size:15px}.cardBtn{font-size:11px}.heroCopy h1{font-size:23px}}
</style>

<body>
<div id="app">
<section id="home" class="screen active"></section>
<section id="cars" class="screen"></section>
<section id="car" class="screen"></section>
<section id="gallery" class="screen"></section>
<section id="calendar" class="screen"></section>
<section id="location" class="screen"></section>
<section id="form" class="screen"></section>
<section id="summary" class="screen"></section>
<section id="done" class="screen"></section>
<section id="bookings" class="screen"></section>
<section id="reviews" class="screen"></section>
<section id="why" class="screen"></section>
<section id="terms" class="screen"></section>
<section id="profile" class="screen"></section>
<div id="toast" class="toast"></div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#081724');tg?.setBackgroundColor?.('#f5f8fb')}catch(e){}
const $=id=>document.getElementById(id);let current='home',history=[],cars=[],selectedCar=null,startDate=null,startTime=null,endDate=null,endTime=null,month=new Date(),selectedLocation=null,locationNote='';
const BUFFER_MS=2*60*60*1000;let currentAvail={bookings:[],maintenance:[]};let galleryState={};
function headers(){return {'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''}}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.message||'Ошибка сервера');return d}
function money(n){return new Intl.NumberFormat('ru-RU').format(Number(n)||0)+' ₽'}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>$('toast').classList.remove('show'),2600)}
function img(path){return path?'/'+String(path).replace(/^\/+/, ''):'/photos/balticar_hero.jpg'}
function show(id,push=true){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(push&&current!==id)history.push(current);current=id;window.scrollTo({top:0,behavior:'smooth'})}
function head(title,back=true){return `<div class="appHead"><button class="headBtn" onclick="${back?'goBack()':'goHome()'}">${back?'‹':'⌂'}</button><div class="headBrand"><div class="headTitle">${title}</div></div>${title==='BALTICAR'?'<div class="logo">BALTICAR</div>':''}</div>`}
function bottom(active){return `<div class="bottomNav"><button class="bn ${active==='home'?'active':''}" onclick="goHome()"><span class="ico">⌂</span>Главная</button><button class="bn ${active==='cars'?'active':''}" onclick="openCars()"><span class="ico">🚗</span>Авто</button><button class="bn ${active==='bookings'?'active':''}" onclick="openBookings()"><span class="ico">▣</span>Брони</button><button class="bn ${active==='profile'?'active':''}" onclick="openProfile()"><span class="ico">♙</span>Профиль</button></div>`}
function goBack(){const x=history.pop()||'home';show(x,false);if(x==='home')renderHome()}
function goHome(){history=[];show('home',false);renderHome()}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function carPhotos(c){let p=(c.photos||[]).filter(Boolean);if(p.length<3){const base=c.id==='i30'?'i30':c.id;const names=[`${base}_1_front.jpg`,`${base}_2_rear.jpg`,`${base}_3_interior.jpg`];p=[...p,...names.filter(x=>!p.includes(x))]}return p.slice(0,3)}
function galleryHTML(c,detail=false){galleryState[c.id]=galleryState[c.id]||0;const p=carPhotos(c),i=galleryState[c.id]%p.length;return `<div class="carGallery ${detail?'detailMain':''}"><img class="galleryImg" id="gimg_${c.id}" src="${img(p[i])}"><button class="gArrow left" onclick="galleryMove('${c.id}',-1,event)">‹</button><button class="gArrow right" onclick="galleryMove('${c.id}',1,event)">›</button><span class="gCount">${i+1} / ${p.length}</span><div class="dots">${p.map((_,n)=>`<span class="dot ${n===i?'active':''}"></span>`).join('')}</div></div>`}
function galleryMove(id,delta,e){e?.stopPropagation();const c=cars.find(x=>x.id===id)||selectedCar;if(!c)return;const p=carPhotos(c);galleryState[id]=(galleryState[id]??0)+delta;if(galleryState[id]<0)galleryState[id]=p.length-1;if(galleryState[id]>=p.length)galleryState[id]=0;renderCars();if(selectedCar?.id===id&&current==='car')renderCar()}
function gallerySet(id,n){galleryState[id]=n;renderGalleryScreen(cars.find(x=>x.id===id)||selectedCar)}
function galleryTouch(id,dir){galleryMove(id,dir,{stopPropagation(){}})}
function renderHome(){let c=cars[0];$('home').innerHTML=`<div class="appHead homeHead"><div class="headBrand"><div class="logo">BALTICAR</div><div class="tag">Аренда автомобилей в Калининграде</div></div></div><div class="hero"><img src="${img('/photos/balticar_hero.jpg')}"><div class="heroCopy"><h1>Свобода<br>в каждом<br>маршруте</h1><p>Аренда авто в Калининграде<br>и области</p><button class="heroCta" onclick="openCars()">Выбрать автомобиль →</button></div></div><div class="sectionHead"><h2>Наш автопарк</h2><button class="sectionLink" onclick="openCars()">Все авто →</button></div><div class="filters"><button class="filter active">Все</button><button class="filter">Седаны</button><button class="filter">Кроссоверы</button></div>${c?`<div class="homeCar"><img src="${img(carPhotos(c)[0])}"><div class="homeCarName">${escapeHtml(c.name)}</div><div class="miniMeta">${c.year||''} · ${escapeHtml(c.gear||'')} · ${escapeHtml(c.fuel||'')}</div><div class="miniRow"><span>♙ ${c.seats||5} мест</span><span>⛽ ${escapeHtml(c.fuel||'Бензин')}</span></div><div class="miniPrice">от ${money(c.rates?.[2]||c.rates?.[0])}/сутки</div></div>`:''}<div class="catalogNote"><div class="nIcon">◉</div><div><b>Единый стиль автопарка</b><p>Все автомобили в одном цвете — белом. Это создаёт единый фирменный стиль и премиальный вид.</p></div></div>${bottom('home')}`}
async function openCars(){show('cars');$('cars').innerHTML=`${head('Наш автопарк')}<div class="catalogTitle">Наш автопарк</div><div class="catalogSub">Выберите автомобиль — далее покажем свободные даты и точную стоимость.</div><div class="filters"><button class="filter active">Все</button><button class="filter">Седаны</button><button class="filter">Кроссоверы</button></div><div id="carlist" class="catalog">Загрузка…</div><div class="catalogNote"><div class="nIcon">▣</div><div><b>Единый стиль автопарка</b><p>Все автомобили в одном цвете — белом. Полная галерея показывает 3 фотографии каждого автомобиля.</p></div></div>${bottom('cars')}`;try{cars=(await api('/api/cars')).cars||[];renderCars()}catch(e){$('carlist').innerHTML='<div class="panel">Не удалось загрузить автомобили.<br>'+escapeHtml(e.message)+'</div>'}}
function renderCars(){const box=$('carlist');if(!box)return;box.innerHTML=cars.map(c=>`<article class="carCard" onclick="openCar('${c.id}')">${galleryHTML(c)}<div class="carName">${escapeHtml(c.name)}</div><div><span class="online">Онлайн-бронирование</span></div><div class="cardDesc">${escapeHtml(c.description||'Надёжный и комфортный автомобиль для города и поездок по области.')}</div><div class="chips"><span class="chip">⚙ ${escapeHtml(c.gear||'АКПП')}</span><span class="chip">⛽ ${escapeHtml(c.fuel||'Бензин')}</span><span class="chip">♙ ${c.seats||5} мест</span><span class="chip">⚪ Белый</span></div><div class="best"><small>Лучшая цена при аренде от 7 суток</small><strong>${money(c.rates?.[2]||c.rates?.[0])}</strong> <span>за сутки</span></div><button class="cardBtn" onclick="event.stopPropagation();openCar('${c.id}')">Забронировать →</button></article>`).join('')||'<div class="panel">Автомобилей пока нет.</div>'}
function openCar(id){selectedCar=cars.find(x=>x.id===id);if(!selectedCar)return;show('car');renderCar()}
function renderCar(){const c=selectedCar;$('car').innerHTML=head(c.name)+`<div class="detailHero">${galleryHTML(c,true)}<div class="detailThumbs">${carPhotos(c).map((p,i)=>`<img class="thumb ${i===(galleryState[c.id]||0)?'active':''}" src="${img(p)}" onclick="gallerySet('${c.id}',${i})">`).join('')}</div><div class="detailBody"><h1>${escapeHtml(c.name)}</h1><div class="detailMeta">${c.year||''} · ${escapeHtml(c.engine||'1.6')} · ${escapeHtml(c.gear||'МКПП')}</div><div class="detailFacts"><span>♙ ${c.seats||5} мест</span><span>⛽ ${escapeHtml(c.fuel||'Бензин')}</span></div><div class="line"></div><div class="specTitle">Характеристики</div><div class="specRow"><span>⚙ КПП</span><b>${escapeHtml(c.gear||'Механическая')}</b></div><div class="specRow"><span>⛽ Топливо</span><b>${escapeHtml(c.fuel||'Бензин')}</b></div><div class="specRow"><span>♙ Вместимость</span><b>${c.seats||5} мест</b></div><div class="line"></div><div class="priceLine"><span>от <b>${money(c.rates?.[0]||0)}</b>/сутки</span><span class="muted">до 7+ суток — ${money(c.rates?.[2]||0)}</span></div><button class="primary" onclick="startBooking()">Забронировать</button></div></div><div class="panel"><h3>Полноценная галерея</h3><div class="muted" style="font-size:11px;line-height:1.4">3 фотографии на каждый автомобиль, стрелки и точки-индикаторы, без растяжения изображения.</div><button class="secondary" style="margin-top:9px" onclick="openGalleryScreen()">Открыть галерею</button></div>`+bottom('cars')}
function openGalleryScreen(){show('gallery');renderGalleryScreen(selectedCar)}
function renderGalleryScreen(c){if(!c)return;const p=carPhotos(c),i=galleryState[c.id]||0;$('gallery').innerHTML=`<div class="appHead" style="margin-bottom:0"><button class="headBtn" onclick="goBack()">‹</button><div class="headBrand"><div class="headTitle">${escapeHtml(c.name)}</div></div><div style="font-size:12px;font-weight:800">${i+1} / ${p.length}</div></div><div style="background:var(--navy);padding:12px;border-radius:0 0 16px 16px"><div class="carGallery"><img id="fullGalleryImg" class="galleryImg" style="height:270px" src="${img(p[i])}"><button class="gArrow left" onclick="galleryMoveFull('${c.id}',-1)">‹</button><button class="gArrow right" onclick="galleryMoveFull('${c.id}',1)">›</button><div class="dots">${p.map((_,n)=>`<span class="dot ${n===i?'active':''}"></span>`).join('')}</div></div><div class="detailThumbs">${p.map((x,n)=>`<img class="thumb ${n===i?'active':''}" src="${img(x)}" onclick="gallerySet('${c.id}',${n})">`).join('')}</div></div><div class="panel"><h3>Полноценная галерея</h3><div class="muted" style="font-size:11px">Изображения сохраняют пропорции. Переключение доступно стрелками, точками и миниатюрами.</div></div>`}
function galleryMoveFull(id,d){const c=cars.find(x=>x.id===id)||selectedCar,p=carPhotos(c);galleryState[id]=(galleryState[id]??0)+d;if(galleryState[id]<0)galleryState[id]=p.length-1;if(galleryState[id]>=p.length)galleryState[id]=0;renderGalleryScreen(c)}
function startBooking(){startDate=startTime=endDate=endTime=null;selectedLocation=null;locationNote='';month=new Date();show('calendar');renderCalendar('start')}
async function getAvail(){return api(`/api/availability?car_id=${encodeURIComponent(selectedCar.id)}&year=${month.getFullYear()}&month=${month.getMonth()+1}`)}
function fmtDate(d){return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})}
function localIso(d,h){const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(h)}:00`}
function blocks(){return [...(currentAvail.bookings||[]),...(currentAvail.maintenance||[])]}
function intervalFree(a,b){if(!(a instanceof Date)||!(b instanceof Date)||b<=a)return false;return !blocks().some(x=>{const bs=new Date(x.start_at).getTime()-BUFFER_MS,be=new Date(x.end_at).getTime()+BUFFER_MS;return a.getTime()<be&&b.getTime()>bs})}
function candidateStartFree(d,h){const a=new Date(d);a.setHours(h,0,0,0);const b=new Date(a);b.setDate(b.getDate()+1);return intervalFree(a,b)}
function candidateEndFree(d,h){if(!startDate||startTime==null)return false;const a=new Date(startDate);a.setHours(startTime,0,0,0);const b=new Date(d);b.setHours(h,0,0,0);return b>a&&intervalFree(a,b)}
function dayHasAvailableTime(d,mode){for(let h=8;h<=20;h++)if(mode==='start'?candidateStartFree(d,h):candidateEndFree(d,h))return true;return false}
async function renderCalendar(mode){$('calendar').innerHTML=head(mode==='start'?'Получение автомобиля':'Возврат автомобиля')+`<div class="pageTitle">${mode==='start'?'Дата и время получения':'Дата и время возврата'}</div><div class="pageSub">${mode==='start'?'Выберите удобную дату и точное время получения.':'Выберите дату и точное время возврата.'}</div><div class="calendar"><div class="calHead"><button onclick="shiftMonth(-1,'${mode}')">‹</button><b>${month.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b><button onclick="shiftMonth(1,'${mode}')">›</button></div><div class="week">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div>${x}</div>`).join('')}</div><div id="days" class="days"></div><div id="times"></div></div><div id="calSummary"></div>`;try{currentAvail=await getAvail();drawDays(currentAvail,mode)}catch(e){toast(e.message)}}
async function shiftMonth(delta,mode){month.setMonth(month.getMonth()+delta);await renderCalendar(mode)}
function drawDays(av,mode){currentAvail=av||{bookings:[],maintenance:[]};const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),today=new Date();today.setHours(0,0,0,0);let html='',offset=first.getDay()===0?6:first.getDay()-1;for(let i=0;i<offset;i++)html+='<div></div>';for(let n=1;n<=last.getDate();n++){const d=new Date(y,m,n),has=dayHasAvailableTime(d,mode),dis=d<today||(mode==='end'&&startDate&&d<=startDate)||!has,sel=(mode==='start'&&startDate&&d.toDateString()===startDate.toDateString())||(mode==='end'&&endDate&&d.toDateString()===endDate.toDateString());html+=`<button class="day ${has?'free':'busy'} ${sel?'selected':''}" ${dis?'disabled':''} onclick="chooseDay(${n},'${mode}')">${n}</button>`}$('days').innerHTML=html;if(mode==='start'&&startDate)drawTimes('start');if(mode==='end'&&endDate)drawTimes('end')}
function chooseDay(n,mode){const d=new Date(month.getFullYear(),month.getMonth(),n);if(mode==='end'&&startDate&&d<=startDate)return;if(!dayHasAvailableTime(d,mode))return;if(mode==='start')startDate=d;else endDate=d;drawTimes(mode)}
function drawTimes(mode){const box=$('times'),d=mode==='start'?startDate:endDate;let html=`<div class="pageSub" style="margin:10px 0 5px">${fmtDate(d)}</div><div class="times">`;for(let h=8;h<=20;h++){const ok=mode==='start'?candidateStartFree(d,h):candidateEndFree(d,h),sel=(mode==='start'?startTime:endTime)===h;html+=`<button class="time ${sel?'selected':''}" ${ok?'':'disabled'} onclick="chooseTime(${h},'${mode}')">${String(h).padStart(2,'0')}:00</button>`}box.innerHTML=html+'</div>';renderCalSummary()}
function chooseTime(h,mode){const d=mode==='start'?startDate:endDate,ok=mode==='start'?candidateStartFree(d,h):candidateEndFree(d,h);if(!ok){toast('Это время недоступно для выбранного периода');return}if(mode==='start'){startTime=h;endDate=new Date(startDate);endDate.setDate(endDate.getDate()+1);endTime=h;renderCalendar('end')}else{endTime=h;drawTimes('end')}}
function rentalDays(){if(!startDate||startTime==null||!endDate||endTime==null)return null;const a=new Date(startDate);a.setHours(startTime);const b=new Date(endDate);b.setHours(endTime);return Math.max(1,Math.ceil((b-a)/86400000))}
function rate(){const d=rentalDays();return d<=3?selectedCar.rates[0]:d<=6?selectedCar.rates[1]:selectedCar.rates[2]}
function renderCalSummary(){const d=rentalDays();if(!d)return;$('calSummary').innerHTML=`<div class="totalBox"><div class="dateConfirm"><b>${fmtDate(startDate)} ${String(startTime).padStart(2,'0')}:00</b><span class="arrow">→</span><b>${fmtDate(endDate)} ${String(endTime).padStart(2,'0')}:00</b></div><div class="totalRow" style="margin-top:8px"><span>${d} ${d===1?'сутки':'суток'}</span><b>${money(d*rate())}</b></div><button class="primary" style="margin-top:8px" onclick="openLocation()">Далее</button></div>`}
function openLocation(){if(!rentalDays()){toast('Выберите дату и время');return}show('location');renderLocation()}
const LOCS=[['airport','✈️','Аэропорт Храброво','Бесплатно',0],['station','🚆','Южный вокзал','Бесплатно',0],['city','🏢','Калининград','От 1 000 ₽',null],['region','🗺️','Калининградская область','От 1 000 ₽',null],['other','📍','Другое место','По запросу',null]];
function renderLocation(){const selected=selectedLocation||'';$('location').innerHTML=head('Место подачи автомобиля')+`<div class="pageSub" style="color:#395775;font-weight:700">Выберите удобное место подачи</div>${LOCS.map(x=>`<button class="locationItem" onclick="selectLocation('${x[0]}')"><div class="locIcon">${x[1]}</div><div class="locMain"><b>${x[2]}${(x[0]==='airport'||x[0]==='station')?'<span class="badge">БЕСПЛАТНО</span>':''}</b><span>${x[3]}</span></div><span class="radio ${selected===x[0]?'on':''}"></span></button>`).join('')}<div class="info">ⓘ Для города и области стоимость может отличаться в зависимости от конкретного адреса. Точную сумму согласует менеджер.</div><button class="primary" style="margin-top:10px" ${selected?'':'disabled'} onclick="goForm()">Далее</button>`}
function selectLocation(type){selectedLocation=type;renderLocation();if(type==='other'||type==='city'||type==='region'){locationNote=''}}
function locationLabel(){return LOCS.find(x=>x[0]===selectedLocation)?.[2]||'Не выбрано'}
function locationFee(){const x=LOCS.find(x=>x[0]===selectedLocation);return x?.[4]??null}
function goForm(){if(!selectedLocation){toast('Выберите место подачи');return}show('form');renderForm()}
function renderForm(){$('form').innerHTML=head('Оформление бронирования')+`<div class="orderCard"><div class="orderCar"><img src="${img(carPhotos(selectedCar)[0])}"><div><b>${escapeHtml(selectedCar.name)}</b><span>${selectedCar.year||''} · ${escapeHtml(selectedCar.engine||'1.6')} · ${escapeHtml(selectedCar.gear||'МКПП')}</span></div></div><div class="orderLine"><span class="orderIcon">▣</span><div>Получение<br><b>${fmtDate(startDate)} · ${String(startTime).padStart(2,'0')}:00</b></div></div><div class="orderLine"><span class="orderIcon">▣</span><div>Возврат<br><b>${fmtDate(endDate)} · ${String(endTime).padStart(2,'0')}:00</b></div></div><div class="orderLine"><span class="orderIcon">✈</span><div>Место подачи<br><b>${locationLabel()}</b><br><span style="color:${locationFee()===0?'var(--green)':'var(--muted)'}">${locationFee()===0?'Бесплатно':locationFee()===null?'Согласует менеджер':money(locationFee())}</span></div></div></div><div class="field"><label>Ваше имя</label><input id="name" placeholder="Имя"></div><div class="field"><label>Телефон</label><input id="phone" type="tel" placeholder="+7 ..."></div><div class="field"><label>Дополнительные пожелания</label><textarea id="comment" placeholder="Детское кресло, точный адрес подачи и т.п."></textarea></div><button class="primary" onclick="openSummary()">Перейти к итогу заказа</button>`}
function openSummary(){const name=$('name').value.trim(),phone=$('phone').value.trim(),comment=$('comment').value.trim();if(!name||phone.length<7){toast('Введите имя и корректный телефон');return}window.__form={name,phone,comment};show('summary');renderSummary()}
function renderSummary(){$('summary').innerHTML=head('Итог заказа')+`<div class="orderCard"><div class="orderCar"><img src="${img(carPhotos(selectedCar)[0])}"><div><b>${escapeHtml(selectedCar.name)}</b><span>${selectedCar.year||''} · ${escapeHtml(selectedCar.engine||'1.6')} · ${escapeHtml(selectedCar.gear||'МКПП')}</span></div></div><div class="orderLine"><span class="orderIcon">▣</span><div>Получение<br><b>${fmtDate(startDate)} · ${String(startTime).padStart(2,'0')}:00</b></div></div><div class="orderLine"><span class="orderIcon">▣</span><div>Возврат<br><b>${fmtDate(endDate)} · ${String(endTime).padStart(2,'0')}:00</b></div></div><div class="orderLine"><span class="orderIcon">✈</span><div>Место подачи<br><b>${locationLabel()}</b><br><span style="color:${locationFee()===0?'var(--green)':'var(--muted)'}">${locationFee()===0?'Бесплатно':locationFee()===null?'Согласует менеджер':money(locationFee())}</span></div></div></div><div class="totalBox"><div class="specTitle">Стоимость</div><div class="totalRow"><span>Аренда (${rentalDays()} ${rentalDays()===1?'сутки':'суток'})</span><b>${money(rentalDays()*rate())}</b></div><div class="totalRow"><span>Подача</span><b>${locationFee()===0?'0 ₽':locationFee()===null?'По запросу':money(locationFee())}</b></div><div class="totalRow total"><span>Итого</span><b>${money(rentalDays()*rate()+(locationFee()||0))}</b></div><div class="totalRow"><span>🔐 Залог (возвращается)</span><b>${money(10000)}</b></div></div><div class="info">Аэропорт Храброво и Южный вокзал — бесплатно. Для города, области и другого адреса точную стоимость подачи согласует менеджер.</div><button class="primary" style="margin-top:10px" onclick="submitBooking()">Забронировать</button>`}
async function submitBooking(){const f=window.__form||{};const a=localIso(startDate,startTime),b=localIso(endDate,endTime);try{const payload={car_id:selectedCar.id,start_at:a,end_at:b,name:f.name,phone:f.phone,comment:f.comment,pickup_location:locationLabel(),pickup_location_type:selectedLocation,pickup_location_note:f.comment||'',pickup_location_fee:locationFee()};const r=await api('/api/bookings',{method:'POST',body:JSON.stringify(payload)});show('done');$('done').innerHTML=`<div class="appHead"><button class="headBtn" onclick="goHome()">⌂</button><div class="headBrand"><div class="headTitle">Бронирование принято</div></div></div><div class="panel center"><div class="doneIcon">✓</div><h2 style="margin:5px 0">Заявка отправлена</h2><div class="muted" style="font-size:12px">Спасибо, ${escapeHtml(f.name)}!</div><div style="font-size:11px;margin-top:8px">Заявка №${r.id}</div><div class="dateConfirm" style="margin-top:15px"><b>${fmtDate(startDate)} ${String(startTime).padStart(2,'0')}:00</b><span class="arrow">→</span><b>${fmtDate(endDate)} ${String(endTime).padStart(2,'0')}:00</b></div><div style="font-size:22px;font-weight:900;margin-top:10px">${money(r.total)}</div><div class="muted" style="font-size:10px;margin-top:3px">${r.days} суток · ${locationLabel()}</div></div><button class="primary" onclick="openBookings()">Мои брони</button><button class="secondary" style="margin-top:8px" onclick="goHome()">Главное меню</button>`;tg?.HapticFeedback?.notificationOccurred('success')}catch(e){toast(e.message)}}
async function openBookings(){show('bookings');$('bookings').innerHTML=`${head('Мои бронирования')}<div class="pageSub">Все ваши заявки в одном месте.</div><div id="blist">Загрузка…</div>${bottom('bookings')}`;try{const d=await api('/api/mybookings');if(!d.bookings.length){$('blist').innerHTML='<div class="panel center">Пока нет бронирований.<button class="primary" style="margin-top:10px" onclick="openCars()">Выбрать автомобиль</button></div>';return}$('blist').innerHTML=d.bookings.map(b=>`<div class="bookingCard"><div style="display:flex;justify-content:space-between;gap:7px"><b style="font-size:12px">${escapeHtml(b.car_name)}</b><span class="status">${status(b.status)}</span></div><div class="muted" style="font-size:10px;margin-top:6px">№${b.id}</div><div style="font-size:11px;margin-top:8px">${escapeHtml(b.start_at)} → ${escapeHtml(b.end_at)}</div><div style="font-size:18px;font-weight:900;margin-top:6px">${money(b.total)}</div>${b.pickup_location?`<div class="muted" style="font-size:10px;margin-top:5px">✈ ${escapeHtml(b.pickup_location)}</div>`:''}${['pending','confirmed'].includes(b.status)?`<button class="secondary" style="margin-top:8px" onclick="cancelBooking(${b.id})">Отменить бронь</button>`:''}</div>`).join('')}catch(e){$('blist').innerHTML='<div class="panel">'+escapeHtml(e.message)+'</div>'}}
function status(s){return ({pending:'🟡 Ожидает',confirmed:'🟢 Подтверждена',cancelled:'⚫ Отменена',rejected:'🔴 Отклонена',expired:'⚪ Истекла'})[s]||s}
async function cancelBooking(id){if(!confirm('Отменить бронирование №'+id+'?'))return;try{await api('/api/bookings/cancel',{method:'POST',body:JSON.stringify({id})});toast('Бронирование отменено');openBookings()}catch(e){toast(e.message)}}
async function openReviews(){show('reviews');$('reviews').innerHTML=`${head('Отзывы')}<div class="pageSub">Реальные впечатления о BALTICAR.</div><div id="rlist">Загрузка…</div>${bottom('home')}`;try{const d=await api('/api/reviews');$('rlist').innerHTML=d.reviews?.length?d.reviews.map(r=>`<div class="bookingCard"><div style="font-size:17px">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><div style="font-size:12px;margin-top:6px">${escapeHtml(r.text)||'Без текста'}</div><div class="muted" style="font-size:9px;margin-top:6px">${escapeHtml(r.name)} · ${escapeHtml(r.car_name)}</div></div>`).join(''):'<div class="panel center">Пока нет отзывов.</div>'}catch(e){$('rlist').innerHTML='<div class="panel">'+escapeHtml(e.message)+'</div>'}}
function openWhy(){show('why');$('why').innerHTML=`${head('Почему BALTICAR')}<div class="pageSub">Единый стиль сервиса и автопарка.</div>${[['◉','Полноценная галерея','3 фотографии на каждый автомобиль, стрелки, точки и миниатюры.'],['◎','Прозрачные цены','Тариф виден до отправки заявки.'],['✓','Онлайн-бронирование','Весь путь от автомобиля до заявки — в одном окне.'],['✈','Удобная подача','Аэропорт и Южный вокзал — бесплатно.'],['♧','Поддержка','Менеджер согласует адрес подачи и детали заказа.']].map(x=>`<div class="panel"><div style="font-size:22px">${x[0]}</div><h3 style="margin:6px 0">${x[1]}</h3><div class="muted" style="font-size:11px;line-height:1.4">${x[2]}</div></div>`).join('')}${bottom('home')}`}
function openTerms(){show('terms');$('terms').innerHTML=`${head('Условия аренды')}${[['◉','Возраст и стаж','От 23 лет, стаж вождения от 3 лет.'],['▣','Документы','Паспорт и водительское удостоверение.'],['◈','Страхование','Автомобили застрахованы по ОСАГО и КАСКО.'],['⌁','Пробег','Лимит 300 км в сутки, далее по условиям.'],['⛽','Топливо','Автомобиль выдаётся с полным баком, вернуть с полным.'],['↺','Отмена бронирования','Бесплатная отмена за 24 часа до начала аренды.']].map(x=>`<div class="panel"><div style="display:flex;gap:10px"><div style="font-size:20px">${x[0]}</div><div><h3>${x[1]}</h3><div class="muted" style="font-size:11px;line-height:1.4">${x[2]}</div></div></div></div>`).join('')}<button class="primary" onclick="openContact()">Написать в поддержку</button>`}
function openContact(){tg?.openTelegramLink?.('https://t.me/Balticar_kgd')||toast('Откройте BALTICAR для связи')}
async function openProfile(){show('profile');$('profile').innerHTML=head('Профиль')+`<div class="profile"><div class="avatar">♙</div><div><b>Ваш профиль</b><div class="muted" style="font-size:10px;margin-top:2px">Данные используются для оформления заявки</div></div></div><div class="panel" style="margin-top:10px"><div class="menuItem" onclick="openBookings()"><span>Мои бронирования</span><b>›</b></div><div class="menuItem" onclick="openReviews()"><span>Отзывы</span><b>›</b></div><div class="menuItem" onclick="openTerms()"><span>Условия аренды</span><b>›</b></div><div class="menuItem" onclick="openContact()"><span>Поддержка</span><b>›</b></div></div>`+bottom('profile')}
renderHome();
</script>
</body></html>
