<script>
const tg=window.Telegram?.WebApp;
function setupFullscreen(){
  try{
    if(!tg)return;
    tg.ready();
    tg.expand();
    if(typeof tg.disableVerticalSwipes==='function')tg.disableVerticalSwipes();
    const dark=tg.colorScheme==='dark';
    const bg=dark?'#07111b':'#f4f7fa';
    if(typeof tg.setHeaderColor==='function')tg.setHeaderColor(bg);
    if(typeof tg.setBackgroundColor==='function')tg.setBackgroundColor(bg);
    if(typeof tg.requestFullscreen==='function'){
      try{tg.requestFullscreen()}catch(e){}
    }
    applySafeArea();
    requestAnimationFrame(()=>{
      try{
        tg.expand();
        if(typeof tg.requestFullscreen==='function' && !tg.isFullscreen)tg.requestFullscreen();
        applySafeArea();
      }catch(e){}
    });
  }catch(e){}
}
function applySafeArea(){
  try{
    const root=document.documentElement;
    const sa=tg?.safeAreaInset||{};
    const csa=tg?.contentSafeAreaInset||{};
    const top=Number(sa.top||0);
    const bottom=Number(sa.bottom||0);
    const cTop=Number(csa.top||0);
    const cBottom=Number(csa.bottom||0);
    root.style.setProperty('--tg-safe-area-inset-top', top+'px');
    root.style.setProperty('--tg-safe-area-inset-bottom', bottom+'px');
    root.style.setProperty('--tg-content-safe-area-inset-top', cTop+'px');
    root.style.setProperty('--tg-content-safe-area-inset-bottom', cBottom+'px');
    // Доп. запас под плавающие кнопки Telegram (Закрыть / …), если insets ещё 0
    const extraTop = (!top && !cTop) ? 52 : 0;
    root.style.setProperty('--admin-extra-top', extraTop+'px');
  }catch(e){}
}
setupFullscreen();
try{
  tg?.onEvent?.('fullscreenChanged',()=>{document.documentElement.classList.toggle('tg-fullscreen',!!tg?.isFullscreen)});
  tg?.onEvent?.('fullscreenFailed',()=>{});
  tg?.onEvent?.('safeAreaChanged',applySafeArea);
  tg?.onEvent?.('contentSafeAreaChanged',applySafeArea);
  tg?.onEvent?.('themeChanged',()=>{
    const dark=tg?.colorScheme==='dark';
    document.documentElement.classList.toggle('dark',dark);
    const bg=dark?'#07111b':'#f4f7fa';
    try{tg.setHeaderColor?.(bg);tg.setBackgroundColor?.(bg)}catch(e){}
  });
  if(tg?.colorScheme==='dark')document.documentElement.classList.add('dark');
}catch(e){}
window.addEventListener('pageshow',()=>setupFullscreen());
window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setupFullscreen()});
const $=(id)=>document.getElementById(id);
const initData=()=>{try{return tg?.initData||''}catch(e){return ''}};
async function waitInitData(){
  for(let i=0;i<30;i++){
    const s=initData();
    if(s)return s;
    await new Promise(r=>setTimeout(r,100));
  }
  return '';
}
const headers=()=>({'Content-Type':'application/json','X-Telegram-Init-Data':initData()});
function withAuth(url){const s=initData();if(!s)return url;return url+(url.includes('?')?'&':'?')+'init_data='+encodeURIComponent(s)}
async function api(url,opt={}){
  const auth=await waitInitData();
  if(!auth) throw new Error('Telegram не передал данные авторизации. Закройте админку и откройте её заново из кнопки «🖥 Открыть веб-админку».');
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),10000);
  try{
    const r=await fetch(withAuth(url),{...opt,signal:controller.signal,headers:{...headers(),...(opt.headers||{})}});
    let d={};try{d=await r.json()}catch{}
    if(!r.ok) throw new Error(d.message||`Ошибка сервера (${r.status})`);
    return d;
  }catch(e){
    if(e.name==='AbortError') throw new Error('Сервер не ответил за 10 секунд. Проверьте деплой Render.');
    throw e;
  }finally{clearTimeout(timer)}
}

async function renderToday(token=viewToken){
  $('content').innerHTML='<div class="panel"><div class="loader">Загружаю планировщик…</div></div>';
  try{
    const d=await api('/api/admin/planner');

async function plannerAction(id,action){
  const payload={id,action};
  if(action==='issue'){
    const dep=prompt('Залог (₽), 0 если без залога:','10000');
    if(dep===null)return;
    const mil=prompt('Пробег при выдаче (км):','');
    if(mil===null)return;
    const fuel=prompt('Топливо при выдаче (например 1/2, полный):','полный');
    if(fuel===null)return;
    payload.deposit_amount=dep;payload.mileage_out=mil;payload.fuel_out=fuel;
  }
  if(action==='return'){
    const mil=prompt('Пробег при возврате (км):','');
    if(mil===null)return;
    const fuel=prompt('Топливо при возврате:','');
    if(fuel===null)return;
    const ds=prompt('Залог: returned / kept / partial','returned');
    if(ds===null)return;
    payload.mileage_in=mil;payload.fuel_in=fuel;payload.deposit_status=ds;
  }
  try{
    await api('/api/admin/booking/action',{method:'POST',body:JSON.stringify(payload)});
    tg?.HapticFeedback?.notificationOccurred?.('success');
    renderToday();
  }catch(e){alert(e.message||e)}
}

async function renderCalendar(token=viewToken){const y=cursor.getFullYear(),m=cursor.getMonth();$('content').innerHTML='<div class="panel"><div class="loader">Загружаю календарь…</div></div>';try{currentData=await api(`/api/admin/calendar?year=${y}&month=${m+1}`);if(token!==viewToken||tab!=='calendar')return;drawCalendar()}catch(e){if(token!==viewToken||tab!=='calendar')return;$('content').innerHTML=`<div class="panel"><div class="empty">${esc(e.message)}</div></div>`}}
function drawCalendar(){
  const d=currentData, y=cursor.getFullYear(), m=cursor.getMonth(), days=d.days||new Date(y,m+1,0).getDate();
  const cars=d.cars||[];
  const today=new Date();
  const isThisMonth=today.getFullYear()===y && today.getMonth()===m;
  const todayN=today.getDate();

  // stats
  let busyToday=0, freeToday=0, monthBookings=0;
  for(const car of cars){
    const blocks=car.blocks||[];
    monthBookings += blocks.filter(b=>b.status!=='maintenance').length;
    const onToday=blocks.some(b=>{
      const a=Math.max(1,b.start_day), e=Math.min(days,b.end_day);
      return isThisMonth && a<=todayN && e>=todayN && b.status!=='pending';
    });
    if(onToday) busyToday++; else freeToday++;
  }

  let html=`<div class="panel calPanel">
    <div class="panelHead">
      <div><h1>Календарь</h1><div class="muted">${months[m]} ${y}</div></div>
      <div class="monthNav">
        <button onclick="moveMonth(-1)">‹</button>
        <button onclick="cursor=new Date();renderCalendar(viewToken)">Сегодня</button>
        <button onclick="moveMonth(1)">›</button>
      </div>
    </div>
    <div class="calStats">
      <div class="calStat"><b>${freeToday}</b><span>свободны сегодня</span></div>
      <div class="calStat"><b>${busyToday}</b><span>заняты сегодня</span></div>
      <div class="calStat"><b>${monthBookings}</b><span>броней в месяце</span></div>
    </div>
    <div class="calLegend">
      <span><i class="d-confirmed"></i> бронь</span>
      <span><i class="d-pending"></i> заявка</span>
      <span><i class="d-maint"></i> ТО</span>
      <span><i class="d-free"></i> свободно</span>
    </div>`;

  for(const car of cars){
    const blocks=(car.blocks||[]).slice().sort((a,b)=>a.start_day-b.start_day);
    const onToday=isThisMonth && blocks.some(b=>b.start_day<=todayN && b.end_day>=todayN && b.status!=='pending');
    html+=`<div class="calCar">
      <div class="calCarHead">
        <div>
          <b>🚗 ${esc(car.name)}</b>
          <div class="muted">${esc(car.gear||'')}</div>
        </div>
        <span class="calBadge ${onToday?'busy':'free'}">${onToday?'Занята сегодня':'Свободна сегодня'}</span>
      </div>
      <div class="calDays">`;
    for(let n=1;n<=days;n++){
      const dt=new Date(y,m,n);
      const week=dt.getDay();
      const isTod=isThisMonth && n===todayN;
      const hit=blocks.find(b=>b.start_day<=n && b.end_day>=n);
      let cls='cd';
      if(week===0||week===6) cls+=' weekend';
      if(isTod) cls+=' today';
      if(hit){
        if(hit.status==='pending') cls+=' pending';
        else if(hit.status==='maintenance') cls+=' maint';
        else cls+=' booked';
      } else cls+=' free';
      const title=hit?(hit.name||hit.status)+' №'+(hit.id||''):'Свободно';
      html+=`<button class="${cls}" title="${esc(title)}" ${hit?`onclick="showBooking(${Number(hit.id||0)}, '${esc(hit.status||'')}')"`:''}>${n}</button>`;
    }
    html+=`</div>`;
    // compact list of bookings
    if(blocks.length){
      html+=`<div class="calList">`;
      for(const b of blocks){
        const st=b.status==='pending'?'заявка':(b.status==='maintenance'?'ТО':(b.status==='completed'?'завершена':'бронь'));
        html+=`<div class="calItem" onclick="showBooking(${Number(b.id||0)}, '${esc(b.status||'')}')">
          <b>${b.status==='maintenance'?'🔒 ':'👤 '}${esc(b.name||'Без имени')}</b>
          <span class="muted">${b.start_day}–${b.end_day} · ${st}${b.id?' · №'+b.id:''}</span>
        </div>`;
      }
      html+=`</div>`;
    } else {
      html+=`<div class="calEmpty muted">Нет броней в этом месяце</div>`;
    }
    html+=`</div>`;
  }

  html+=`<div id="detail"></div>
    <details class="calBlock">
      <summary>Занять даты вручную (ТО / блок)</summary>
      <div id="blockFormWrap"></div>
    </details>
  </div>`;
  $('content').innerHTML=html;
  // re-inject block form if template exists in old code path
  try{
    const wrap=$('blockFormWrap');
    if(wrap){
      wrap.innerHTML=`<div class="blockForm">
        <select id="blkCar"></select>
        <div class="row2"><input type="date" id="blkStartDate"><select id="blkStartTime"></select></div>
        <div class="row2"><input type="date" id="blkEndDate"><select id="blkEndTime"></select></div>
        <input id="blkReason" placeholder="Причина (ТО, мойка…)">
        <button class="miniBtn primary" onclick="createManualBlock()">Занять</button>
      </div>`;
      fillBlockForm();
    }
  }catch(e){}
}
function moveMonth(n){cursor.setMonth(cursor.getMonth()+n);renderCalendar(viewToken)}

function hourOptions(selected){
  let h='';
  for(let i=8;i<=20;i++){
    const v=String(i).padStart(2,'0')+':00';
    h+=`<option value="${v}" ${v===selected?'selected':''}>${v}</option>`;
  }
  return h;
}
function fillBlockForm(){
  const carSel=$('blkCar'); if(!carSel)return;
  const cars=(currentData&&currentData.cars)||[];
  carSel.innerHTML=cars.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')||'<option value="">Нет авто</option>';
  const st=$('blkStartTime'), et=$('blkEndTime');
  if(st&&!st.options.length){st.innerHTML=hourOptions('10:00');}
  if(et&&!et.options.length){et.innerHTML=hourOptions('10:00');}
  const y=cursor.getFullYear(), m=cursor.getMonth();
  const iso=d=>{const mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${d.getFullYear()}-${mm}-${dd}`};
  const today=new Date(); const base=new Date(y,m,Math.min(today.getDate(),28));
  if($('blkStartDate')&&!$('blkStartDate').value)$('blkStartDate').value=iso(base);
  if($('blkEndDate')&&!$('blkEndDate').value){const e=new Date(base);e.setDate(e.getDate()+1);$('blkEndDate').value=iso(e);}
}

let bookingsCache=[];let bookingFilter='all';let bookingSearch='';
function bookingStatusMatch(b){
  if(bookingFilter==='all')return true;
  if(bookingFilter==='rejected')return b.status==='rejected'||b.status==='cancelled';
  if(bookingFilter==='completed')return b.status==='completed';
  return b.status===bookingFilter;
}
function bookingSearchMatch(b){const q=bookingSearch.trim().toLowerCase();if(!q)return true;return [b.id,b.car_name,b.name,b.phone,b.start_label,b.end_label].some(v=>String(v??'').toLowerCase().includes(q))}
function renderBookingList(){
  const filtered=bookingsCache.filter(b=>bookingStatusMatch(b)&&bookingSearchMatch(b));
  const list=filtered.length?filtered.map(b=>`<div class="item bookingItem">
    <div class="bookingMain"><div><b>№${b.id} · ${esc(b.car_name)}</b><div class="muted">${esc(b.name||'Клиент')} · ${esc(b.phone||'')}</div></div><span class="status ${esc(b.status)}">${esc(b.status_label)}</span></div>
    <div class="bookingMeta"><div>📅 ${esc(b.start_label)} → ${esc(b.end_label)}</div><div>💰 <b>${Number(b.total||0).toLocaleString('ru-RU')} ₽</b></div>${b.pickup?`<div>📍 ${esc(b.pickup)}</div>`:''}${b.payment_label||b.payment_method?`<div>💳 ${esc(b.payment_label||b.payment_method)}</div>`:''}</div>
    <div class="bookingActions"><button class="miniBtn" onclick="showBookingFromList(${Number(b.id)})">Подробнее</button>${b.status==='pending'?`<button class="miniBtn primary" onclick="adminBookingAction(${Number(b.id)},'confirm')">✅ Подтвердить</button><button class="miniBtn danger" onclick="adminBookingAction(${Number(b.id)},'reject')">❌ Отклонить</button>`:''}${b.status==='pending'||b.status==='confirmed'?`<button class="miniBtn danger" onclick="adminBookingAction(${Number(b.id)},'cancel')">Отменить</button>`:''}</div>
  </div>`).join(''):`<div class="emptyFiltered">По выбранным условиям бронирований не найдено.</div>`;
  $('bookingList').innerHTML=list;

let financePeriod='month';
function financeRange(period){
  const d=new Date(); const end=new Date(d.getFullYear(),d.getMonth(),d.getDate()); let start=new Date(end);
  if(period==='today')start=new Date(end);
  else if(period==='7')start.setDate(start.getDate()-6);
  else if(period==='month')start=new Date(end.getFullYear(),end.getMonth(),1);
  else if(period==='prev'){start=new Date(end.getFullYear(),end.getMonth()-1,1);return {from:dateInput(start),to:dateInput(new Date(end.getFullYear(),end.getMonth(),0))};}
  else if(period==='year')start=new Date(end.getFullYear(),0,1);
  return {from:dateInput(start),to:dateInput(end)};
}
function dateInput(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function money0(n){return Number(n||0).toLocaleString('ru-RU')+' ₽'}
function setFinancePeriod(p){financePeriod=p;const r=financeRange(p);renderFinance(viewToken,r.from,r.to)}

    seats:+$('cf_seats').value||5,
    description:$('cf_desc').value.trim(),
    plate:($('cf_plate')&&$('cf_plate').value||'').trim(),
    vin:($('cf_vin')&&$('cf_vin').value||'').trim(),
    active:$('cf_active').checked
  };
  try{
    await api('/api/admin/cars/save',{method:'POST',body:JSON.stringify(payload)});
    tg?.HapticFeedback?.notificationOccurred?.('success');
    renderCars();
  }catch(e){alert(e.message||e)}
}
async function deleteCar(carId,isCustom){
  const msg=isCustom?'Удалить автомобиль?':'Отключить базовый автомобиль (удаление из кода недоступно)?';
  if(!confirm(msg))return;
  try{
    const r=await api('/api/admin/cars/delete',{method:'POST',body:JSON.stringify({car_id:carId})});
    alert(r.soft?'Автомобиль отключён':'Удалено');
    renderCars();
  }catch(e){alert(e.message||e)}
}

async function renderTools(token=viewToken){
  $('content').innerHTML='<div class="panel"><div class="loader">…</div></div>';
  try{
    const cars=(await api('/api/admin/cars')).cars||[];
    window._carsCache=cars;
    const opts=cars.filter(c=>c.active).map(c=>`<option value="${esc(c.car_id)}">${esc(c.name)}</option>`).join('');
    const today=new Date();
    const iso=d=>d.toISOString().slice(0,16);
    const start=iso(today);
    const end=iso(new Date(today.getTime()+24*3600*1000));
    $('content').innerHTML=`
      <div class="panel">
        <div class="panelHead"><h1>Операции</h1></div>
        <div class="carForm">
          <b>➕ Ручная бронь (подтверждённая)</b>
          <select id="mb_car">${opts}</select>
          <input id="mb_name" placeholder="ФИО клиента *">
          <input id="mb_phone" placeholder="Телефон *">
          <label class="muted">Начало</label>
          <input id="mb_start" type="datetime-local" value="${start}">
          <label class="muted">Конец</label>
          <input id="mb_end" type="datetime-local" value="${end}">
          <input id="mb_total" type="number" placeholder="Сумма (пусто = авторасчёт)">
          <textarea id="mb_comment" placeholder="Комментарий">Ручная бронь</textarea>
          <button class="miniBtn primary" onclick="createManualBooking()">Создать бронь</button>
        </div>
        <div class="carForm">
          <b>📊 Экспорт броней в Excel (CSV)</b>

          <button class="miniBtn primary" onclick="exportCsv()">Скачать CSV</button>

      </div>`;
  }catch(e){$('content').innerHTML=`<div class="panel"><div class="empty">${esc(e.message||e)}</div></div>`}

async function createManualBooking(){
  const start=$('mb_start').value; const end=$('mb_end').value;
  if(!start||!end){alert('Укажите даты');return}
  if(!$('mb_name').value.trim()||!$('mb_phone').value.trim()){alert('Укажите ФИО и телефон');return}
  // datetime-local already local; send as-is (backend treats naive as Europe/Kaliningrad)
  const payload={
    car_id:$('mb_car').value,
    name:$('mb_name').value.trim(),
    phone:$('mb_phone').value.trim(),
    start_at:start.length===16?start+':00':start,
    end_at:end.length===16?end+':00':end,
    comment:($('mb_comment').value||'Ручная бронь').trim()
  };
  const t=$('mb_total').value; if(t)payload.total=+t;
  try{
    const r=await api('/api/admin/booking/manual',{method:'POST',body:JSON.stringify(payload)});
    alert('Бронь №'+(r.id||'')+' создана'+(r.contract_number?(', договор '+r.contract_number):''));
    setTab('bookings');
  }catch(e){alert(e.message||e)}
}
function openContract(id){
  if(!id){alert('Укажите № брони');return}
  const url=withAuth('/api/admin/contract?id='+id);
  window.open(url,'_blank');
}
async function sendTpl(bid){
  try{
    const t=await api('/api/admin/templates');
    const list=(t.templates||[]).map((x,i)=>`${i+1}. ${x.title}`).join('\\n');
    const n=prompt('Выберите шаблон:\\n'+list+'\\n\\nВведите номер:','1');
    if(n===null)return;
    const idx=(+n||1)-1;
    const tpl=(t.templates||[])[idx];
    if(!tpl){alert('Нет такого шаблона');return}
    const r=await api('/api/admin/templates/send',{method:'POST',body:JSON.stringify({booking_id:bid,template_id:tpl.id})});
    alert(r.ok?'Отправлено клиенту в Telegram':(r.message||'Готово'));
  }catch(e){alert(e.message||e)}
}
async function exportCsv(){
  const f=$('ex_from').value||''; const t=$('ex_to').value||'';
  let url='/api/admin/export.csv';
  const q=[]; if(f)q.push('from='+f); if(t)q.push('to='+t);
  if(q.length)url+='?'+q.join('&');
  window.open(withAuth(url),'_blank');
}

async function boot(){
  $('content').innerHTML='<div class="panel"><div class="loader">Подключаюсь к админке…</div></div>';

  if(!s){$('content').innerHTML='<div class="panel"><div class="empty"><b>Не удалось получить авторизацию Telegram.</b><br>Закройте это окно и откройте админку заново через кнопку «🖥 Открыть веб-админку».</div></div>';return;}
  setTab('today');
}
boot();
