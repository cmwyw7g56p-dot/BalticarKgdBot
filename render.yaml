services:
  - type: web
    name: balticar-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: CHANNEL_USERNAME
        value: '@Balticar_kgd'
      - key: DB_PATH
        value: data/balticar.sqlite3
      - key: PENDING_HOLD_MINUTES
        value: '60'
      - key: TIMEZONE
        value: Europe/Kaliningrad
      - key: WEBHOOK_SECRET
        generateValue: true
